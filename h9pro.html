<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2.8寸触摸屏 · 交互原型</title>
<style>
:root{--theme:#237CFD;--cur:#FFD700;--hint:#A8C8F0;--sc0bg:#1A2A2A;--sc1bg:#1A1A2A;--btn-pri:#ffffff;--btn-sec:#A8C8F0;--btn-sec-ink:#237CFD;--t1:#1a77ff;--t2:#b4d3ff;--t3:#7aa7e8;--t4:#e8f1ff;--t5:#eaf3ff;--t6:#c5dbfc;--t7:#b8d5ff;--t8:#b4d3ff;--t9:#cfe3ff;--t10:#f0f6ff;--t11:#f6faff;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:radial-gradient(circle at 50% 30%,#3a4254,#1a1d23);color:#222;display:flex;align-items:flex-start;justify-content:center;user-select:none;-webkit-user-select:none;overflow:auto;padding:24px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}

/* ========== Device chassis ========== */
.device{background:var(--pos-chassis, #2F2B4E);padding:30px 22px 26px;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.device::before{content:'LAKALA';position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:4px;font-weight:900;font-family:'Arial Black','Microsoft YaHei',sans-serif;color:rgba(255,255,255,.18);text-shadow:0 1px 0 rgba(255,255,255,.25),0 -1px 0 rgba(0,0,0,.35);}
.device::after{content:'';position:absolute;top:20px;right:22px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5fe17a,#1f8a35);box-shadow:0 0 4px rgba(95,225,122,.6)}
.screen-wrap{width:326px;height:246px;background:#000;padding:3px;border-radius:4px;box-shadow:inset 0 0 0 1px #06080c,0 0 0 3px #0a0c10,0 0 0 4px rgba(255,255,255,.04)}
.screen{width:320px;height:240px;background:#000;position:relative;overflow:hidden}

/* ========== Status bar ========== */
.statusbar{height:32px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:11px;color:#fff;position:relative;z-index:2}
.statusbar .l,.statusbar .r{display:flex;align-items:center;gap:4px}
.statusbar .net-ic{display:inline-flex;align-items:center;line-height:1;font-size:14px}
.statusbar .net-ic svg{display:block;width:14px;height:12px}
.statusbar .net-lab{font-size:11px;font-weight:400;letter-spacing:.2px;color:#fff}
.statusbar .iot{display:inline-flex;align-items:center;gap:2px;margin-left:3px;padding:0 4px;border-radius:6px;background:transparent}
.statusbar .iot svg{display:block}
.statusbar .iot .lab{font-size:9px;font-weight:700;color:#fff;letter-spacing:.3px;line-height:1}
.statusbar .iot-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#19a960;box-shadow:0 0 3px rgba(25,169,96,.7);animation:iotPulse 2s ease-in-out infinite}
.statusbar .center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center}
.statusbar .battery{display:flex;align-items:center;gap:2px;font-size:11px}
.statusbar .battery svg{display:block;width:24px;height:12px}
@keyframes iotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}

/* ========== Body container ========== */
.body{position:absolute;top:32px;left:0;right:0;bottom:0;overflow:hidden;background:#000}

/* ========== Page indicator ========== */
.pageind{position:absolute;bottom:-2px;left:0;right:0;height:18px;display:flex;gap:6px;justify-content:center;align-items:center;z-index:5;pointer-events:none}
.pageind span{display:block;height:2px;width:14px;background:var(--t6);border-radius:2px;transition:.2s}
.pageind span.on{width:22px;height:3px;background:var(--theme)}

/* ========== Page 1 — Home ========== */
.home{padding:4px 8px 14px;height:100%;display:flex;flex-direction:column;gap:4px;min-height:0}
.home-fill{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;gap:5px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.menubtn{width:22px;height:18px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;padding:2px}
.menubtn span{display:block;height:1.5px;background:var(--theme);border-radius:2px}
.menubtn:active span{background:var(--theme)}
.logo{font-weight:800;font-size:13px;letter-spacing:.4px;color:var(--theme);font-family:'Arial Black','Microsoft YaHei',sans-serif;display:flex;align-items:center}
.logo img{height:40px;width:auto;max-width:240px;display:block}
.hint{font-size:16px;height:32px;line-height:32px;color:var(--hint);text-align:center;font-weight:500;flex-shrink:0}
.amount-box{border:none;border-radius:3px;height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent}
.amount-box .cur{color:var(--theme);font-size:16px;margin-right:4px;font-weight:700;font-family:'DIN Alternate','Arial',sans-serif}
.amount-box .val{font-size:52px;font-weight:800;color:var(--amt,#fff);letter-spacing:.5px;font-family:'DIN Alternate','Arial',sans-serif;line-height:1}.amount-box .amt-sym{color:var(--cur);margin-right:6px;font-size:33.8px;vertical-align:baseline;position:relative;top:-13px}.amount-box .amt-dec{font-size:24px;font-weight:800;vertical-align:0.08em;letter-spacing:0}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:var(--pos-shortcut-h, 56px);flex-shrink:0}
.shortcut{border:1px solid #333;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:#2a2a2a;transition:.12s;padding:2px 1px}
.shortcut[data-sc="0"]{background:var(--sc0bg)}
.shortcut[data-sc="1"]{background:var(--sc0bg)}
.shortcut .ic{font-size:20px;line-height:1;margin-top:-2px}
.shortcut img.ic{width:var(--pos-shortcut-ic, 28px);height:var(--pos-shortcut-ic, 28px);object-fit:contain;margin-top:-2px}
.shortcut .lb{font-size:13px;color:#fff;font-weight:500;line-height:1;text-align:center;white-space:nowrap}
.shortcut.sel{border-color:var(--theme);box-shadow:0 0 0 1px var(--theme) inset}
.shortcut.sel .lb{color:var(--theme);font-weight:700}
.shortcut:active{border-color:var(--theme);box-shadow:0 0 0 1px var(--theme) inset}

/* ========== Drawer ========== */
.drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:.22s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:213px;background:#2a2a2a;z-index:11;transform:translateX(-100%);transition:.25s cubic-bezier(.2,.8,.2,1);padding-top:18px;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer h3{padding:8px 12px 6px;font-size:9px;color:var(--theme);font-weight:500;letter-spacing:1px}
.drawer .item{padding:9px 12px;font-size:11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #3a3a3a;cursor:pointer;color:#fff}
.drawer .item .ic{font-size:14px}
.drawer .item img.ic{width:18px;height:18px;object-fit:contain;font-size:0}
.drawer .item:active{background:#f8f8f8}

/* ========== Page 2 — 6-grid menu ========== */
.grid6{padding:6px 8px 8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,91px);gap:6px;height:100%}
.menu-split{display:flex;flex-direction:column;height:100%;background:#000}
.merchant-bar{display:none}
.menu-main{display:flex;flex:1;overflow:hidden}
.menu-left{width:210px;flex-shrink:0;display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;height:46px;padding:0 8px 0 6px;cursor:pointer;gap:6px}
.mrow:active{background:#161616}
.mrow.sel{background:var(--theme)}
.mic-sm{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.mnum{color:#fff;font-size:12px;font-weight:700;min-width:14px;flex-shrink:0}
.mname{color:#fff;font-size:13px;flex:1}
.marr{color:#fff;font-size:18px;font-weight:400;line-height:1}
.menu-right{flex:1;display:flex;flex-direction:column;padding:8px 6px;gap:6px;background:#000}
.mtile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;background:#2a2a2a;gap:5px}

.mtile:active,.mtile.sel{background:#1a1a1a;border:1px solid var(--theme);box-shadow:0 0 0 1px var(--theme) inset}
.mic-lg{width:40px;height:40px;object-fit:contain}
.mtile-lb{color:#fff;font-size:12px;text-align:center;line-height:1.2}
.mtile-num{color:#fff;font-weight:700}

.tile{border:1px solid #333;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:#2a2a2a;padding:4px 2px;position:relative}
.tile .num{font-size:inherit;line-height:inherit;color:inherit;font-weight:inherit;font-family:inherit;margin-right:3px}
.tile .ic{font-size:48px;line-height:1}
.tile img.ic{width:48px;height:48px;object-fit:contain}
.tile .lb{font-size:16px;height:16px;line-height:16px;color:#fff;font-weight:500;margin-top:2px}
.tile:active{transform:translateY(1px)}
.tile.sel{border-color:var(--theme);box-shadow:0 0 0 1px var(--theme) inset}
.tile.sel .lb{color:var(--theme);font-weight:700}

/* ========== Generic menu list ========== */
.menulist{height:100%;display:flex;flex-direction:column;background:#000}
.menu-head{display:none}
.menu-head .back{position:absolute;left:4px;cursor:pointer;color:#fff;font-size:15px;padding:2px 6px;line-height:1;font-weight:400}
.menu-head .title{font-weight:600;color:#fff}
.menu-rows{flex:1;overflow-y:auto}
.menu-row{padding:8px 12px;border-bottom:1px solid #333;font-size:11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#fff;background:#1e1e1e}
.menu-row .num{display:inline-block;min-width:14px;color:#fff;font-weight:600;margin-right:8px;font-family:'DIN Alternate','Arial',sans-serif}
.menu-row.sel{background:var(--theme);color:var(--btn-pri);font-weight:700}
.menu-row.sel .num{color:#fff}
.menu-row.sel .chev{color:#fff}
.menu-row .chev{color:#bbb;font-size:13px}
.menu-row:active{background:#2a2a2a} */
.menulist .menu-head{font-size:16px;line-height:16px;height:22px;padding:0 8px}
.menulist .menu-head .title{font-size:16px;line-height:16px;font-weight:600}
.menulist .menu-head .back{font-size:16px;line-height:16px;padding:2px 6px}
.menulist .menu-row{font-size:16px;line-height:16px}
.menulist .menu-row>span:first-child{display:inline-flex;align-items:center;min-height:16px}
.menulist .menu-row .num{font-size:inherit;line-height:16px;min-width:14px;margin-right:8px;font-weight:inherit;font-family:inherit}
.menulist .menu-row.sel .num{font-size:inherit;line-height:16px}
.menulist .menu-row .chev{font-size:16px;line-height:16px}
/* 次级菜单：每 2 项一组的分块 + 组间留白 */
.menulist .menu-rows{display:flex;flex-direction:column;gap:11px;padding:10px 12px;overflow-y:auto}
.menulist .menu-group{background:#242424;border-radius:8px;overflow:hidden;flex-shrink:0}
.menulist .menu-row{padding:13px 14px;border:none!important;border-radius:0}
.menulist .menu-group .menu-row+.menu-row{border-top:1px solid #3a3a3a!important}
.menulist .menu-row:not(.sel){background:transparent}
.menulist .tile .lb{font-size:16px;line-height:16px;height:16px}
.menulist .tile .num{font-size:inherit;line-height:inherit;font-weight:inherit;font-family:inherit;margin-right:3px}

/* ========== Transaction screens ========== */
.tx{height:100%;display:flex;flex-direction:column}
.tx-head{display:none}
.tx-head .back{position:absolute;left:4px;cursor:pointer;font-size:15px;color:#fff;padding:2px 6px;line-height:1;font-weight:400}
.tx-head .title{color:#fff}
.tx-head .switch{position:absolute;right:6px;color:#fff;font-size:10px;cursor:pointer;padding:2px 6px;border:1px solid #fff;border-radius:3px;font-weight:500;background:transparent}
.tx-head .switch.sw-ic{padding:1px 4px;border:none;display:inline-flex;align-items:center;justify-content:center}
.tx-head .switch.sw-ic svg{display:block;width:16px;height:16px;color:#fff}
.tx-amt{text-align:center;padding:5px;font-family:'DIN Alternate','Arial',sans-serif;font-size:16px;color:var(--theme);font-weight:800;letter-spacing:.5px;background:var(--t4)}
.tx-amt .cur{font-size:11px;margin-right:2px;font-weight:600}
.tx-main{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:6px 8px;overflow:hidden}
.tx-hint{font-size:10px;color:#666;text-align:center;line-height:1.4}
.tx-footer{display:flex;border-top:1px solid #eee;flex-shrink:0}
.tx-footer button{flex:1;padding:7px;border:none;background:#fff;font-size:11px;cursor:pointer;color:#333;font-family:inherit}
.tx-footer button.primary{background:var(--theme);color:var(--btn-pri);font-weight:600}
.tx-footer button:not(:last-child){border-right:1px solid #eee}
.tx-footer button:active{filter:brightness(.95)}

/* scan preview */
.scan-box{width:96px;height:96px;border:1px solid #333;position:relative;overflow:hidden;background:transparent}
.scan-box::before,.scan-box::after,.scan-box>.c1,.scan-box>.c2{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--theme)}
.scan-box::before{top:0;left:0;border-right:0;border-bottom:0}
.scan-box::after{top:0;right:0;border-left:0;border-bottom:0}
.scan-box .c1{bottom:0;left:0;border-right:0;border-top:0}
.scan-box .c2{bottom:0;right:0;border-left:0;border-top:0}
.scan-line{position:absolute;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,var(--theme) 30%,var(--theme) 70%,transparent);animation:scan 1.8s linear infinite;box-shadow:0 0 6px var(--theme)}
@keyframes scan{0%{top:4px}50%{top:84px}100%{top:4px}}

/* qr code */
.qr-frame{padding:5px;background:#fff;border:1px solid #ddd;border-radius:3px}
.qr-frame svg{display:block;width:96px;height:96px}

/* comm spinner */
.comm-spinner{width:34px;height:34px;border:3px solid #f0f0f0;border-top-color:var(--theme);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:inline-block}
.dots::after{content:'';animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* pin */
.pin-dots{display:flex;gap:7px;margin:3px 0 6px}
.pin-dots span{width:9px;height:9px;border:1.5px solid #999;border-radius:50%;transition:.1s}
.pin-dots span.f{background:#222;border-color:#222}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 28px;width:100%}
.pin-pad button{padding:5px 0;border:1px solid #d8dde2;border-radius:3px;background:#fff;font-size:11px;cursor:pointer;font-family:inherit}
.pin-pad button:active{background:#f0f0f0}
.pin-pad button.pin-fn{color:var(--theme);font-size:10px;background:#fafbfc;display:flex;align-items:center;justify-content:center;padding:4px 0}
.pin-pad button.pin-fn svg{display:block}
.pin-pad button.pin-fn:active{background:var(--t4)}

/* signature */
.sig-wrap{flex:1;display:flex;flex-direction:column;padding:5px 8px;gap:4px}
.sig-wrap .lbl{font-size:9px;color:#888}
canvas.sig{flex:1;border:1px dashed #aaa;background:#fff;cursor:crosshair;width:100%}

/* result */
.result{padding:6px 10px;flex:1;overflow-y:auto}
.result-status{text-align:center;font-size:13px;color:#19a960;font-weight:700;margin:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.result-status .ic{font-size:22px}
.result-status img.ic{width:38px;height:38px;object-fit:contain;font-size:0}
.result-fail .result-status{color:var(--theme)}
#body.tx-dark .result-status *{color:#fff!important}
.result-row{display:flex;justify-content:space-between;font-size:9px;padding:2px 0;border-bottom:1px dotted #eee}
.result-row .k{color:#222}
.result-row .v{color:#222;font-weight:500}

/* installment options */
.inst-opts{display:flex;gap:8px;margin-top:2px}
.inst-opts label{display:flex;align-items:center;gap:3px;font-size:9px;color:#333;cursor:pointer}
.inst-opts input{transform:scale(.85);accent-color:var(--theme);cursor:pointer}

/* card method icons */
.card-methods{display:flex;gap:14px;margin-top:4px;justify-content:center;width:100%}
.card-methods .m{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:#555}
.card-methods .m .ic{font-size:24px}
.card-methods .m img.ic{width:36px;height:36px;object-fit:contain;font-size:0}.card-methods-lg .card-methods .m img.ic{width:72px;height:72px}

/* ========== Ledger ========== */
.ledger{display:flex;flex-direction:column;height:100%}
.led-top{display:none;color:#fff}
.led-top .back{position:absolute;left:4px;cursor:pointer;font-size:16px;line-height:16px;color:#fff;padding:2px 6px}
.led-top .title{font-size:16px;line-height:16px;font-weight:600;color:#fff}
.led-top .print{position:absolute;right:6px;font-size:9px;line-height:normal;color:#fff;cursor:pointer;padding:2px 6px;border:1px solid #fff;border-radius:3px;font-weight:500;background:transparent}
/* cloud summary */
.cs-body{flex:1;overflow-y:auto;padding:4px 6px 8px;background:#fff;font-size:9px;color:#222}
.cs-section{font-size:10px;font-weight:700;color:#222;text-align:center;padding:7px 0 4px;border-bottom:1px solid #e8eef7;margin-top:4px}
.cs-section:first-child{margin-top:0}
.cs-sub{font-size:9px;color:#444;font-weight:600;padding:5px 4px 2px;background:var(--t11)}
.cs-row{display:flex;align-items:center;padding:5px 4px;border-bottom:1px dashed #eef1f5;line-height:1.2}
.cs-row .lb{flex:0 0 56px;color:#222}
.cs-row .lb2{flex:0 0 38px;color:#666;text-align:left}
.cs-row .ct{flex:1;text-align:right;color:#444;font-family:'DIN Alternate','Arial',sans-serif;padding-right:6px}
.cs-row .am{flex:0 0 96px;text-align:right;color:#222;font-weight:600;font-family:'DIN Alternate','Arial',sans-serif}
.cs-head{background:#fafbfc;font-weight:600;color:#888;border-bottom:1px solid #e1e8f1}
.cs-head .lb,.cs-head .lb2,.cs-head .ct,.cs-head .am{color:#888}
/* 灰色虚线分隔（在指定行之上画一条灰色虚线） */
.cs-row.cs-divider{border-top:1px dashed #b8bec6}
/* 蓝色加粗强调行 */
.cs-row.cs-emph .lb,.cs-row.cs-emph .lb2{color:var(--theme);font-weight:700}
.cs-row.cs-emph .am{color:var(--theme)}
/* 仅金额变蓝 */
.cs-row.cs-emph-amt .lb{color:var(--theme);font-weight:700}
.cs-row.cs-emph-amt .am{color:var(--theme)}
.led-body{flex:1;display:flex;overflow:hidden}
.led-tabs{width:50px;background:#f5f6f8;display:flex;flex-direction:column;border-right:1px solid #e2e6ea;flex-shrink:0}
.led-tabs .tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;cursor:pointer;min-height:44px;position:relative}
.led-tabs .tab.on{background:#fff;color:var(--theme);font-weight:700}
.led-tabs .tab.on::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--theme);border-radius:2px}
.led-tabs .filter-btn{padding:8px 4px;text-align:center;cursor:pointer;border-top:1px solid #e2e6ea;background:#fafbfc}
.led-tabs .filter-btn:active{background:#eee}
.led-tabs .filter-btn .pill{display:inline-block;padding:3px 10px;border:none;color:#fff;border-radius:3px;font-size:9px;font-weight:500;background:var(--theme)}
.led-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.led-search{padding:4px 6px;border-bottom:1px solid #f0f0f0;background:#fafbfc;flex-shrink:0}
.led-search input{width:100%;padding:3px 7px;font-size:10px;border:1px solid #d8dde2;border-radius:10px;outline:none;background:#fff;font-family:inherit}
.led-search input:focus{border-color:var(--theme)}
.led-list{flex:1;overflow-y:auto}
.led-item{padding:5px 8px;border-bottom:1px solid #f3f3f3;cursor:pointer}
.led-item:active{background:#f5f7fa}
.led-row1{display:flex;align-items:center;gap:5px}
.led-row1 .dot{width:6px;height:6px;border-radius:50%;background:var(--theme);flex-shrink:0}
.led-row1 .ch{flex:1;font-size:10px;color:#222;font-weight:500}
.led-row1 .amt{font-size:11px;font-weight:700;color:#222;font-family:'DIN Alternate',sans-serif}
.led-row2{display:flex;justify-content:space-between;margin-top:1px;padding-left:11px;color:#888;font-size:8px}
.led-empty{padding:30px 10px;text-align:center;font-size:10px;color:#999}

/* summary */
.sum-cards{display:flex;gap:0;border-bottom:1px solid #eee}
.sum-card{flex:1;padding:6px 8px;text-align:center}
.sum-card:last-child{border-right:0}
.sum-card .k{font-size:8px;color:#888;margin-bottom:2px}
.sum-card .v{font-size:13px;color:var(--theme);font-weight:700;font-family:'DIN Alternate',sans-serif}
.sum-list{flex:1;overflow-y:auto}
.sum-line{display:flex;justify-content:space-between;padding:5px 10px;font-size:9px;border-bottom:1px solid #f5f5f5;color:#333}
.sum-line .lab{color:#555}
.sum-line .val{color:#222;font-weight:600;font-family:'DIN Alternate',sans-serif}

/* filter half-modal */
.filter-mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:.2s}
.filter-mask.on{opacity:1;pointer-events:auto}
.filter-panel{position:absolute;left:0;right:0;bottom:0;height:55%;background:#1e1e1e;z-index:21;transform:translateY(100%);transition:.25s cubic-bezier(.2,.8,.2,1);border-top:1px solid #e2e6ea;display:flex;flex-direction:column}
.filter-panel.on{transform:translateY(0)}
.filter-panel.cloud{height:90%}
.cf-body{flex:1;overflow-y:auto;padding:6px 8px}
.cf-topbar{display:flex;align-items:center;height:22px;padding:0 4px;background:#1e1e1e;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;gap:4px;border-bottom:1px solid #333}
.cf-topbar .back{cursor:pointer;color:#fff;font-size:15px;padding:2px 6px;line-height:1;font-weight:400}
.cf-topbar .ttl{font-weight:600}
.cf-body h4{font-size:10px;padding:2px 4px 6px;color:#fff;font-weight:600}
.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.filter-grid button{padding:6px;border:1px solid #444;border-radius:3px;background:#2a2a2a;font-size:9px;cursor:pointer;font-family:inherit;color:#fff}
.filter-grid button.on{background:var(--theme);border-color:var(--theme);color:#fff;font-weight:600}
/* cloud filter sections */
.cf-section{margin-bottom:8px}
.cf-label{font-size:9px;color:#aaa;font-weight:500;padding:3px 0;border-bottom:1px solid #333;margin-bottom:5px}
.cf-wheel{display:flex;gap:3px;justify-content:center}
.cf-wheel-col{display:flex;flex-direction:column;align-items:center;background:#f5f6f8;border-radius:3px;padding:1px 0;min-width:32px}
.cf-wheel-col button{width:100%;background:none;border:0;font-size:9px;cursor:pointer;color:#888;padding:1px 0;line-height:1;font-family:inherit}
.cf-wheel-col button:active{color:var(--theme)}
.cf-wheel-col .v{font-size:11px;font-weight:700;color:#222;padding:2px 0;font-family:'DIN Alternate',sans-serif}
.cf-wheel-labels{display:flex;gap:3px;justify-content:center;margin-top:3px}
.cf-wheel-labels span{min-width:32px;text-align:center;font-size:8px;color:#999}
.cf-radios{display:flex;gap:10px;padding:2px 0}
.cf-radios label{display:flex;align-items:center;gap:3px;font-size:10px;cursor:pointer;color:#222}
.cf-checks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 4px;padding:2px 0}
.cf-checks label{display:flex;align-items:center;gap:3px;font-size:9px;cursor:pointer;color:#222;white-space:nowrap}
.cf-radios input,.cf-checks input{accent-color:var(--theme);transform:scale(.85);cursor:pointer}
.cf-actions{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #333;background:#1e1e1e;flex-shrink:0}
.cf-actions button{flex:1;padding:6px;border:1px solid #d8dde2;border-radius:3px;background:var(--hint);font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--btn-sec-ink)}
.cf-actions button.primary{background:var(--theme);color:var(--btn-pri);border-color:var(--theme)}
.cf-actions button:active{filter:brightness(.95)}
/* time fields (clickable summary in cloud filter) */
.cf-time-fields{display:flex;flex-direction:column;gap:5px}
.cf-time-field{border:1px solid #e2e6ea;border-radius:3px;padding:5px 8px;cursor:pointer;background:#fafbfc;display:flex;align-items:center;justify-content:space-between}
.cf-time-field:active{background:#f0f2f4}
.cf-tf-label{font-size:9px;color:#888}
.cf-tf-val{font-size:10px;color:#222;font-family:'DIN Alternate','Arial',sans-serif;font-weight:600}

/* time picker modal (sub-modal over the filter panel) */
.time-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:.18s}
.time-mask.on{opacity:1;pointer-events:auto}
.time-picker{position:absolute;left:0;right:0;bottom:0;height:50%;background:#fff;z-index:31;transform:translateY(100%);transition:.25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-top:1px solid #e2e6ea;box-shadow:0 -4px 12px rgba(0,0,0,.18)}
.time-picker.on{transform:translateY(0)}
.tp-title{padding:6px 10px;font-size:11px;font-weight:600;color:#222;text-align:center;border-bottom:1px solid #eee;background:#fafbfc;flex-shrink:0}
.tp-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 8px;overflow:hidden}
.tp-actions{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #eee;background:#fafbfc;flex-shrink:0}
.tp-actions button{flex:1;padding:6px;border:1px solid #d8dde2;border-radius:3px;background:var(--hint);font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--btn-sec-ink)}
.tp-actions button.primary{background:var(--theme);color:var(--btn-pri);border-color:var(--theme)}
.tp-actions button:active{filter:brightness(.95)}

/* head actions (cloud detail header) */
.tx-head .head-actions{position:absolute;right:6px;display:flex;align-items:center;gap:4px}
.tx-head .filter-ic{background:transparent;border:1px solid #fff;border-radius:3px;padding:2px 5px;cursor:pointer;display:flex;align-items:center;line-height:1;font-family:inherit}
.tx-head .filter-ic svg{display:block}
.tx-head .filter-ic svg path,.tx-head .filter-ic svg circle,.tx-head .filter-ic svg line{stroke:#fff !important}
.tx-head .head-actions .print{font-size:9px;color:#fff;cursor:pointer;padding:2px 6px;border:1px solid #fff;border-radius:3px;font-weight:500;background:transparent}

/* 云账本·交易明细：标题 16px；筛选/打印与交易汇总打印按钮同规格（9px） */
.tx.ledger-hd{font-size:inherit;line-height:inherit}
.tx.ledger-hd .tx-head{font-size:inherit;line-height:inherit;min-height:22px;height:22px;padding:0 8px}
.tx.ledger-hd .tx-head .title{font-size:16px;line-height:16px;font-weight:600}
.tx.ledger-hd .tx-head .back{font-size:16px;line-height:16px;padding:2px 6px}
.tx.ledger-hd .tx-head .head-actions .print{font-size:9px!important;line-height:normal!important;font-weight:500;padding:2px 6px}
.tx.ledger-hd .tx-head .filter-ic{padding:2px 5px}

/* selected ledger row */
.led-item{border-left:3px solid transparent;padding:5px 8px 5px 5px}
.led-item.sel{background:var(--theme);border-left-color:var(--theme)}
.led-item.sel .ch{color:#fff;font-weight:700}

/* ledger detail */
.ld{padding:6px 10px;flex:1;overflow-y:auto}
.ld-row{display:flex;justify-content:space-between;font-size:9px;padding:3px 0;border-bottom:1px dotted #eee}
.ld-row .k{color:#888}
.ld-row .v{color:#222;font-weight:500}

/* coupon list */
.coupon-list{padding:6px;flex:1;overflow-y:auto}
.coupon-card{border:1px solid #eee;border-radius:5px;padding:5px 7px;margin-bottom:5px;font-size:10px;display:flex;align-items:center;gap:6px;background:#fff}
.coupon-card .badge{padding:1px 4px;background:var(--t4);color:var(--theme);border-radius:2px;font-size:8px;font-weight:600}
.coupon-card .name{flex:1;color:#222}
.coupon-card .meta{color:#888;font-size:8px}

/* generic stub screen */
.stub{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px;overflow:hidden}
.stub .ic{font-size:36px;opacity:.5}
.stub .soon{width:140px;max-width:78%;max-height:100%;height:auto;object-fit:contain;display:block;margin:0 auto;flex-shrink:1}
.stub .nm{font-size:12px;color:#fff;font-weight:600}
.stub .desc{font-size:9px;color:var(--hint);text-align:center;max-width:200px;line-height:1.5}
/* firmware upgrade */
.fw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 26px}
.fw-ic{width:52px;height:52px;color:var(--theme)}
.fw-ic svg{width:100%;height:100%;display:block}
.fw-msg{font-size:13px;color:#fff;font-weight:500;text-align:center;line-height:1.4}
.fw-bar{width:100%;height:8px;border-radius:4px;background:#333;overflow:hidden}
.fw-fill{height:100%;width:0;background-color:var(--theme);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);background-size:22px 22px;border-radius:4px;transition:width .25s linear;animation:fw-run .55s linear infinite}
.fw-fill.done{animation:none;background-image:none}
@keyframes fw-run{to{background-position:22px 0}}
.fw-pct{font-size:22px;font-weight:700;color:var(--theme);font-family:'DIN Alternate','Arial',sans-serif;line-height:1}
#body.tx-dark .fw-ic,#body.tx-dark .fw-pct{color:var(--theme)!important}
/* platform activate select */
.plat-list{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:4px 14px}
.plat-row{display:flex;align-items:center;gap:11px;background:#242424;border:1px solid #3a3a3a;border-radius:8px;padding:6px 12px;cursor:pointer}
.plat-row:active{background:#2e2e2e}
.plat-ic{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.plat-nm{font-size:15px;font-weight:600}
.plat-chev{margin-left:auto;font-size:22px;opacity:.55}

/* toast */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:4px;font-size:10px;z-index:30;opacity:0;pointer-events:none;transition:.18s;max-width:80%;text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#voice-announce{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:50;pointer-events:none;animation:va-in .2s ease}
#voice-announce.out{animation:va-out .3s ease forwards}
@keyframes va-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes va-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(4px)}}

/* comm modal (popup over a screen) */
.comm-modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.18s}
.comm-modal.on{opacity:1;pointer-events:auto}
.comm-modal-inner{background:#2a2a2a;padding:14px 20px;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:140px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.comm-modal-msg{font-size:16px;line-height:16px;color:var(--hint);text-align:center;font-weight:500}

/* ========== Coupon flow (美团券核销) ========== */
.cp-head{display:none;font-size:11px;font-weight:600;flex-shrink:0}
.cp-head .back{position:absolute;left:2px;cursor:pointer;font-size:16px;color:#fff;padding:2px 6px;line-height:1;font-weight:400}
.cp-head .title{color:#fff;font-weight:600}
/* scan */
.cp-scan{flex:1;background:var(--t5);display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 8px 4px}
.cp-scan-hint{font-size:10px;color:var(--theme);text-align:center;font-weight:500}
.cp-scan-box{width:130px;height:90px;background:linear-gradient(135deg,#1a1f2e,#0d0f17);position:relative;overflow:hidden;margin:2px 0}
.cp-scan-line{position:absolute;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,#5ce0c8,#5ce0c8,transparent);box-shadow:0 0 5px #5ce0c8;animation:cpscan 1.8s linear infinite}
@keyframes cpscan{0%,100%{top:4px}50%{top:82px}}
.cp-scan-foot{margin-top:auto;padding:3px 8px;font-size:10px;color:var(--hint);cursor:pointer;display:flex;align-items:center;gap:3px;font-weight:500}
.cp-scan-foot:active{opacity:.7}
/* manual entry */
.cp-manual{flex:1;display:flex;flex-direction:column;padding:5px 6px;background:#fff}
.cp-manual-lbl{font-size:10px;color:#666;text-align:center}
.cp-manual-code{font-size:13px;font-family:'DIN Alternate','Consolas',monospace;text-align:center;border-bottom:1px solid #ddd;padding:5px 4px 6px;margin:3px 0 5px;min-height:14px;letter-spacing:1px;color:#222;font-weight:600}
.cp-keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:3px;flex:1}
.cp-keypad button{padding:2px 0;border:1px solid #d8dde2;border-radius:3px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.cp-keypad button:active{background:#f0f3f6}
.cp-keypad button.confirm{grid-row:span 2;background:var(--theme);color:var(--btn-pri);border-color:var(--theme);font-weight:600;font-size:13px}
.cp-keypad button.fn{font-size:10px;color:#333}
/* quantity check */
.cp-qty{flex:1;padding:7px 10px;display:flex;flex-direction:column;gap:4px;background:#fff}
.cp-qty-hint{text-align:center;font-size:11px;color:#222;font-weight:600;padding:3px}
.cp-qty-info{font-size:10px;display:flex;align-items:center;white-space:nowrap}
.cp-qty-info .lab{color:#222;flex-shrink:0}
.cp-qty-info .val{color:#222;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-qty-box{background:var(--t5);border-radius:4px;padding:7px 10px;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.cp-qty-row{display:flex;align-items:center;gap:6px;font-size:10px;color:#222}
.cp-qty-row .num{font-weight:700;font-size:13px;min-width:34px;text-align:center;color:#222;font-family:'DIN Alternate',sans-serif}
.cp-qty-btn{width:18px;height:18px;border-radius:3px;background:var(--theme);color:var(--btn-pri);border:0;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;font-family:inherit}
.cp-qty-btn:active{filter:brightness(.9)}
.cp-qty-max{font-size:9px;color:#888}
.cp-actions{margin-top:auto;display:flex;gap:8px;padding-top:6px}
.cp-actions button{flex:1;padding:7px;border:0;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.cp-actions .cancel{background:var(--hint);color:var(--btn-sec-ink);font-weight:600}
.cp-actions .confirm{background:var(--theme);color:var(--btn-pri);font-weight:600}
.cp-actions button:active{filter:brightness(.93)}
/* result */
.cp-result{flex:1;display:flex;flex-direction:column;padding:14px 14px 7px;background:#fff}
.cp-result-status{text-align:center;font-size:12px;color:#222;font-weight:700;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cp-result-status .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;line-height:1}
.cp-result-status .ic.ok{background:var(--theme)}
.cp-result-status .ic.fail{background:#f5762a}
.cp-result-name{font-size:10px;border-top:1px dashed #ddd;padding:8px 2px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.cp-result-name .lab{color:#888;flex-shrink:0}
.cp-result-name .val{color:#222;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* records list & filter */
.cp-head-right{position:absolute;right:2px;color:#fff;font-size:10px;cursor:pointer;padding:2px 8px;font-weight:500}
.cp-head-right:active{opacity:.7}
.cp-rec-list{flex:1;overflow-y:auto;background:#fff;padding:0 6px}
.cp-rec-item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #f0f0f0}
.cp-rec-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:8px;font-weight:700;line-height:1}
.cp-rec-icon.mt{background:#FFC900;color:#fff;border-radius:4px}
.cp-rec-icon.dy{background:#0a0a0a;border-radius:50%}
.cp-rec-icon.dy svg{width:14px;height:14px}
.cp-rec-body{flex:1;font-size:9px;color:#333;line-height:1.5;min-width:0}
.cp-rec-body .nm{color:#222;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-rec-body .meta{color:#aaa;font-size:8px}
.cp-rec-status{font-size:9px;color:#222;font-weight:500;flex-shrink:0}
.rf-plat{display:flex;gap:6px}
.rf-plat button{padding:5px 14px;border:1px solid #d8dde2;border-radius:3px;background:#fff;font-size:10px;cursor:pointer;font-family:inherit;color:#666}
.rf-plat button.on{background:var(--t4);border-color:var(--theme);color:var(--theme);font-weight:600}
.cf-label .small{color:#aaa;font-size:8px;font-weight:400;margin-left:3px}
/* analysis */
.cp-ana{flex:1;padding:8px 10px;background:#fff;overflow-y:auto}
.cp-ana-time{margin-bottom:8px}
.cp-ana-time .lbl{font-size:10px;color:#222;font-weight:600;margin-bottom:5px}
.cp-ana-time .lbl .small{color:#aaa;font-size:8px;font-weight:400;margin-left:3px}
.cp-ana-time .fields{display:flex;gap:8px}
.cp-ana-time .field{border:1px solid var(--t8);background:var(--t10);border-radius:4px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.cp-ana-time .field .name{font-size:9px;color:#333}
.cp-ana-time .field .val{font-size:11px;color:var(--theme);font-weight:700;margin-top:2px;font-family:'DIN Alternate',sans-serif}
.cp-ana-card{border:1px solid #e0e0e0;border-radius:5px;padding:8px 10px;margin-top:4px}
.cp-ana-card .ttl{font-size:11px;font-weight:700;color:#222;margin-bottom:6px}
.cp-ana-card table{width:100%;font-size:9px;border-collapse:collapse}
.cp-ana-card th{color:#888;font-weight:400;padding:2px 4px;font-size:9px;text-align:right}
.cp-ana-card th.lbl{text-align:left;color:#222;font-weight:500}
.cp-ana-card td{padding:3px 4px;font-size:9px;text-align:right;color:#222;font-family:'DIN Alternate',sans-serif;font-weight:600}
.cp-ana-card td.lbl{text-align:left;color:#444;font-family:inherit;font-weight:400}
/* refund flow (分期&码牌退货 / 扫码退货) */
.refund-pwd-title{text-align:center;font-size:11px;color:var(--hint);padding:14px 0 6px}
.pwd-dashes{display:flex;justify-content:center;gap:10px;margin:6px 0 4px;padding:0 18px}
.pwd-dashes span{flex:1;height:18px;border-bottom:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;line-height:1}
.refund-form{flex:1;display:flex;flex-direction:column;padding:4px 12px 0;background:#fff}
.refund-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #eee;font-size:11px;cursor:pointer;gap:6px}
.refund-row.focused .lbl{color:var(--theme);font-weight:600}
.refund-row .lbl{width:auto;min-width:54px;color:#444;font-size:11px;flex-shrink:0;white-space:nowrap}
.refund-row .inp{flex:1;font-size:11px;color:#222;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refund-row .inp.placeholder{color:var(--t2)}
.refund-row .scan-ic{color:var(--theme);cursor:pointer;flex-shrink:0;font-size:13px;line-height:1;padding:2px;display:inline-flex;align-items:center;justify-content:center}
.refund-row .scan-ic.scan-btn{padding:1px;border-radius:3px}
.refund-row .scan-ic.scan-btn svg{display:block;width:16px;height:16px}
.refund-result{flex:1;display:flex;flex-direction:column;padding:10px 16px 8px;background:#fff}
.refund-check{text-align:center;margin:6px 0 8px}
.refund-check .ic{width:46px;height:46px;border-radius:50%;background:var(--theme);color:var(--btn-pri);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1}
.refund-info{border-top:1px dashed #ddd;padding:6px 0;flex:1}
.refund-info .row{display:flex;justify-content:space-between;padding:3px 0;font-size:10px}
.refund-info .row .k{color:#888}
.refund-info .row .v{color:#222;font-family:'DIN Alternate',sans-serif;font-weight:500}

.cursor-blink{display:inline-block;color:var(--theme);font-weight:400;animation:blinker 1s step-end infinite}

/* ========== 交易流程字号：汉字 / 金额 / 字母数字 统一 16×16 ========== */

.tx .tx-head .switch{font-size:16px;line-height:16px}
.tx .cp-head-right{font-size:12px;line-height:16px}
.tx .tx-head .head-actions .print{font-size:16px;line-height:16px}
.tx .tx-hint,.tx .cp-scan-hint,.tx .cp-scan-foot{font-size:16px;line-height:16px}
.tx .tx-footer button,.tx .cp-actions button,.tx .cp-actions .cancel,.tx .cp-actions .confirm,.tx .refund-confirm{font-size:16px;line-height:16px}
.tx .tx-main,.tx .card-methods .m,.tx .inst-opts label{font-size:16px;line-height:16px}
.tx .sig-wrap .lbl{font-size:16px;line-height:16px}
.tx .result-status{font-size:16px;line-height:16px}
.tx .result-row,.tx .result-row .k,.tx .result-row .v{font-size:16px;line-height:16px}
.tx .refund-pwd-title{font-size:16px;line-height:16px}

.tx .cp-manual-lbl,.tx .cp-qty-hint,.tx .cp-qty-info,.tx .cp-qty-info .lab,.tx .cp-qty-max,.tx .cp-qty-row,.tx .cp-qty-row .num{font-size:16px;line-height:16px}

.tx .cp-qty-info .lab{white-space:nowrap}
.tx .cp-qty-info .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .cp-manual-code{font-size:16px;line-height:16px;font-family:'DIN Alternate','Consolas',monospace;font-weight:600}
.tx .cp-result-status{font-size:16px;line-height:16px}
.tx .cp-result-name,.tx .cp-result-name .lab,.tx .cp-result-name .val{font-size:16px;line-height:16px}
.tx .cp-result-name{white-space:nowrap;overflow:hidden}
.tx .cp-result-name .lab{white-space:nowrap}
.tx .cp-result-name .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tx .tx-amt,.tx .tx-amt .cur,.tx .tx-num{font-size:16px;line-height:16px;font-family:'DIN Alternate','Arial',sans-serif;font-weight:700}

.tx [style*="font-size"],
.tx [style*="DIN Alternate"]{font-size:16px!important;line-height:16px!important}

/* generic alert dialog */
.alert-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:32;opacity:0;pointer-events:none;transition:.18s}
.alert-mask.on{opacity:1;pointer-events:auto}
.alert-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:33;background:#fff;border-radius:6px;width:240px;max-width:90%;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.alert-modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.alert-inner{padding:12px}
.alert-icon{text-align:center;font-size:22px;line-height:1;color:#f5a623;margin-bottom:6px}
.alert-msg{font-size:11px;color:#222;text-align:center;line-height:1.5;padding:0 6px}
.alert-actions{display:flex;gap:6px;margin-top:12px}
.alert-actions button{flex:1;padding:6px;border:1px solid #d8dde2;border-radius:3px;background:var(--hint);font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--btn-sec-ink)}
.alert-actions button.primary{background:var(--theme);color:var(--btn-pri);border-color:var(--theme)}
.alert-actions button:active{filter:brightness(.95)}

/* ========== Physical keypad ========== */
.keypad{display:grid;grid-template-columns:repeat(4,68px);grid-template-rows:repeat(4,50px);gap:8px;padding:0;background:transparent;border-radius:0;box-shadow:none}
.key{background:linear-gradient(#1a1a1a,#0d0d0d);color:#e8eaee;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:transform .06s,filter .08s,box-shadow .08s;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:600;font-family:inherit;outline:none;user-select:none}
.key:hover{filter:brightness(1.1)}
.key:active,.key.press{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);filter:brightness(.92)}
.key.cancel{background:linear-gradient(#a02530,#7a1722);box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.key.clear{background:linear-gradient(#c89630,#9b6f1d);box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.key.confirm{background:linear-gradient(#1f8c4d,#136634);grid-row:span 2;height:auto;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);font-size:13px;line-height:1.3}
.key.fn{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;line-height:1}
.key.fn .lb{font-size:22px;font-weight:700;line-height:1;display:inline-flex;align-items:flex-end}
.key.fn .lb .sub{font-size:15px;font-weight:700;line-height:1;margin-left:1px}
.key.fn .ar{font-size:14px;opacity:.9;font-weight:700}
.key.special{font-size:11px}
.key.cancel{position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
.key.cancel .lb{font-size:11px;font-weight:600;line-height:1}
.key.cancel .ic-corner{position:absolute;right:5px;bottom:4px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.85;line-height:0}
.key.cancel .ic-corner svg{display:block}
/* 数字+字母组合键 */
.key.digit{padding:0;line-height:1}
.key.digit .d{font-size:22px;font-weight:700;line-height:1}
.key.digit .ltr{font-size:11px;font-weight:600;letter-spacing:1.2px;color:rgba(255,255,255,.7);line-height:1;margin-left:3px;align-self:flex-end;padding-bottom:1px;position:relative;top:-13px}

/* hint bar */
.hint-bar{color:rgba(255,255,255,.7);font-size:11px;text-align:center;max-width:780px;padding:0 12px;line-height:1.7}
.hint-bar kbd{background:#0a0f1e;color:#fff;padding:1px 6px;border-radius:3px;font-family:'Consolas',monospace;font-size:10px;margin:0 1px;border:1px solid rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.hint-bar b{color:#fff}

/* drag indicator */
.screen.dragging{cursor:grabbing}

/* ===== 码牌交易账本 ===== */
.qrm-wrap{display:flex;flex-direction:column;height:100%;background:#fff}
.qrm-head{display:none;color:#fff}
.qrm-head .back{position:absolute;left:4px;cursor:pointer;font-size:16px;line-height:16px;color:#fff;padding:2px 6px;font-weight:400}
.qrm-head .title{font-size:16px;line-height:16px;font-weight:600;color:#fff;letter-spacing:.5px}
.qrm-head .demo-tog{position:absolute;right:6px;font-size:9px;color:#fff;cursor:pointer;padding:1px 5px;border:1px solid rgba(255,255,255,.7);border-radius:3px;background:transparent;font-family:inherit}
.qrm-col-head{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;padding:5px 10px;border-bottom:1px solid #ececec;font-size:9px;color:#999;flex-shrink:0}
.qrm-list{flex:1;overflow-y:auto}
.qrm-row{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;padding:6px 10px;border-bottom:1px solid #f3f3f3;font-size:9px;color:#222;gap:4px}
.qrm-row:active{background:#f5f7fa}
.qrm-row .mid{word-break:break-all;font-family:'DIN Alternate','Arial',sans-serif;font-weight:600;line-height:1.25}
.qrm-row .mname{color:#333;line-height:1.35;word-break:break-all}
.qrm-row .qbtn{color:var(--theme);font-size:9px;cursor:pointer;text-align:right;font-weight:500;padding:2px 4px}
.qrm-row .qbtn:active{opacity:.6}
.qrm-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;font-size:10px;gap:6px;padding-bottom:8px}
.qrm-empty .ill{position:relative;width:60px;height:60px;flex-shrink:0}
.qrm-empty .ill .card{position:absolute;left:10px;top:5px;width:40px;height:48px;border:2px solid var(--t7);border-radius:9px;background:var(--t5);display:flex;align-items:center;justify-content:center;color:var(--t7);font-size:22px;font-weight:700;font-family:'DIN Alternate','Arial',sans-serif}
.qrm-empty .ill .s1,.qrm-empty .ill .s2,.qrm-empty .ill .s3{position:absolute;background:var(--t9);border-radius:1px}
.qrm-empty .ill .s1{width:6px;height:6px;left:52px;top:4px;transform:rotate(45deg)}
.qrm-empty .ill .s2{width:4px;height:4px;left:2px;top:22px;transform:rotate(45deg)}
.qrm-empty .ill .s3{width:4px;height:4px;left:54px;top:30px;transform:rotate(45deg)}

/* 码牌账本汇总（按用户提供样式） */
.qrs-scroll{flex:1;overflow-y:auto;background:#fff;padding:8px 14px}
.qrs-group{margin-bottom:10px}
.qrs-group .ttl{font-size:11px;font-weight:700;color:#222;padding:2px 0 4px}
.qrs-line{display:grid;grid-template-columns:1fr 60px 80px;align-items:center;padding:3px 0;font-size:10px;color:#333}
.qrs-line .cnt{text-align:right;color:#555}
.qrs-line .amt{text-align:right;font-family:'DIN Alternate','Arial',sans-serif;font-weight:600;color:#222}
.qrs-divider{border-top:1px dashed #d0d0d0;margin:6px 0}
.qrs-total{display:grid;grid-template-columns:1fr 60px 80px;align-items:center;padding:3px 0;font-size:10px;font-weight:600;color:#222}
.qrs-total .cnt{text-align:right}
.qrs-total .amt{text-align:right;font-family:'DIN Alternate','Arial',sans-serif}
.qrs-foot{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;color:#222}
.qrs-foot.bold{font-weight:700}
.qrs-foot .v{font-family:'DIN Alternate','Arial',sans-serif}

/* 单笔交易详情（图3样式） */
.qrt-scroll{flex:1;overflow-y:auto;background:#f5f6f8}
.qrt-card{margin:6px;background:#fff;border-radius:6px;padding:6px 10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.qrt-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;padding:5px 0}
.qrt-row .k{color:#888;font-weight:400}
.qrt-row .v{color:#222;font-weight:500;text-align:right;max-width:60%;word-break:break-all;font-family:'DIN Alternate','Arial',sans-serif}
.qrt-row .v.txt{font-family:inherit}
.qrt-divider{border-top:1px dashed #d0d0d0;margin:4px 0}
.qrt-row.big .k{font-size:11px;color:#222;font-weight:500}
.qrt-row.big .v{font-size:12px;font-weight:700;color:#111}

/* 码牌账本筛选面板（图3右） */
.qrf-input{width:100%;padding:6px 8px;font-size:10px;border:1px solid #444;border-radius:3px;outline:none;background:#2a2a2a;font-family:inherit;color:#fff}
.qrf-input:focus{border-color:var(--theme);background:#333}
.qrf-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.qrf-chips button{padding:6px 14px;border:1px solid #444;border-radius:4px;background:#2a2a2a;font-size:10px;cursor:pointer;font-family:inherit;color:#fff;min-width:54px}
.qrf-chips button.on{background:var(--theme);border-color:var(--theme);color:#fff;font-weight:600}

/* ========== Control Panel (top slide-down) ========== */
.ctrl-mask{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.ctrl-mask.on{opacity:1;pointer-events:auto}
.ctrl-panel{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(15,15,15,0.93);z-index:41;transform:translateY(-100%);transition:.25s cubic-bezier(.2,.8,.2,1);border-radius:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ctrl-panel.on{transform:translateY(0)}
.ctrl-panel .handle{width:36px;height:4px;background:#444;border-radius:2px;margin:8px auto 4px}
.ctrl-switches{display:flex;justify-content:space-around;padding:12px 12px 8px;border-bottom:1px solid #333}
.ctrl-switch{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.ctrl-switch .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#333;transition:.15s;font-size:14px;color:#aaa}
.ctrl-switch .ic svg{width:18px;height:18px;color:#aaa}
.ctrl-switch.on .ic{background:var(--theme);color:var(--btn-pri)}
.ctrl-switch.on .ic svg{color:#fff}
.ctrl-switch .lb{font-size:16px;line-height:16px;color:#aaa}
.ctrl-switch.on .lb{color:var(--theme);font-weight:600}
.ctrl-sliders{padding:10px 14px}
.ctrl-slider{display:flex;align-items:center;gap:8px;margin-bottom:15px}
.ctrl-slider .lb{font-size:16px;line-height:16px;color:#fff;white-space:nowrap;flex-shrink:0;min-width:4em}
.ctrl-slider input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#444;border-radius:2px;outline:none}
.ctrl-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--theme);cursor:pointer}
.ctrl-slider .val{font-size:10px;color:var(--theme);width:28px;text-align:right;font-weight:600}

/* ========== Control panel header ========== */
.ctrl-panel .handle{display:none}
.ctrl-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 2px}
.ctrl-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:.3px}
.ctrl-settings-btn{background:none;border:none;cursor:pointer;padding:3px;color:var(--theme);display:flex;align-items:center;border-radius:50%;transition:.15s}
.ctrl-settings-btn:active{background:#2a2a2a}
.ctrl-settings-btn svg{width:16px;height:16px}

/* ========== Settings page ========== */
.settings-page{position:absolute;top:32px;left:0;right:0;bottom:0;background:#000;z-index:45;transform:translateX(100%);transition:.25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.settings-page.on{transform:translateX(0)}
#screen.settings-on .statusbar{z-index:46}
.settings-head{display:none}
.settings-back{color:#fff;font-size:16px;cursor:pointer;padding:0 6px 0 0;line-height:1;font-weight:400}
.settings-head-title{flex:1;text-align:center;font-size:16px;font-weight:700;color:#fff;margin-right:22px}
.settings-scroll{flex:1;overflow-y:auto;padding:6px 8px 4px}
.settings-group{background:#1e1e1e;border-radius:8px;margin-bottom:6px;overflow:hidden;box-shadow:none}
.settings-item{display:flex;align-items:center;padding:7px 8px;border-bottom:.5px solid #333;cursor:pointer;gap:8px;transition:.1s}
.settings-item:last-child{border-bottom:none}
.settings-item:active{background:#2a2a2a}
.s-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-icon svg{width:15px;height:15px;color:#fff;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-label{flex:1;font-size:16px;color:#fff;font-weight:500}
.s-chev{color:#888;font-size:16px;line-height:1}
/* ========== Toggle switch ========== */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:11px;transition:.2s;cursor:pointer}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle-switch input:checked+.toggle-slider{background:var(--theme)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px)}
/* ========== Installment select ========== */
.inst-sel-btn{display:block;width:100%;padding:11px;background:#fff;border:2px solid var(--theme);border-radius:8px;font-size:16px;color:var(--theme);font-weight:600;cursor:pointer;text-align:center;transition:.12s}
.inst-sel-btn:active{background:var(--t4);transform:scale(.98)}
.inst-radio{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1.5px solid #3a3a3a;border-radius:8px;cursor:pointer;background:#242424;transition:.12s}
.inst-radio.sel{border-color:var(--theme);background:#2e2e2e}
.inst-radio:active{background:#333}
.inst-radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid #666;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.12s}
.inst-radio.sel .inst-radio-dot{border-color:var(--theme)}
.inst-radio-inner{width:9px;height:9px;border-radius:50%;background:var(--theme);display:none}
.inst-radio.sel .inst-radio-inner{display:block}
.inst-seq{font-size:13px;font-weight:700;opacity:.5;min-width:15px;text-align:center;font-family:'DIN Alternate','Arial',sans-serif}
.inst-p{font-size:17px;font-weight:600}
.inst-amt{flex:1;text-align:right;margin-right:10px;font-size:15px;opacity:.65}
.inst-radio.sel .inst-amt{opacity:1}
.inst-amt-lab{font-size:11px;opacity:.55;margin-bottom:1px}
#body.tx-dark .inst-radio.sel .inst-p,#body.tx-dark .inst-radio.sel .inst-amt{color:var(--theme)!important}

/* ===== TX Screen Dark Mode ===== */
#body.tx-dark{background:#000;color:#fff}

#body.tx-dark .cp-manual,#body.tx-dark .cp-qty,#body.tx-dark .cp-result,

#body.tx-dark .tx-footer button{background:var(--hint);color:var(--btn-sec-ink);font-weight:600}
#body.tx-dark .tx-footer button#t-clear{background:var(--hint)!important;color:var(--btn-sec-ink)!important;border-radius:5px!important;font-weight:600!important}

#body.tx-dark .sig{background:#fff!important}
#body.tx-dark .qr-frame{background:#fff!important}

#body.tx-dark *{color:#fff}
#body.tx-dark .tx-amt{color:var(--theme)}
#body.tx-dark .badge{color:var(--theme)!important}
#body.tx-dark button{color:#fff}
#body.tx-dark .cancel{background:var(--hint)!important;color:var(--btn-sec-ink)!important;font-weight:600}
#body.tx-dark .cs-body *,#body.tx-dark .cf-topbar *,
#body.tx-dark .tp-title,#body.tx-dark .cs-sub,#body.tx-dark .cs-head{color:#fff}
#body.tx-dark [class*="border"]{border-color:#333}

/* tx-amt white in dark mode */
#body.tx-dark .tx-amt{color:#fff!important}

/* ============ POS调色盘 智能搭配桥接:弧度/字号/选中效果/弹窗/退出 ============ */
.shortcut{ border-radius: var(--pos-radius, 4px); }
.tile{ border-radius: var(--pos-radius, 5px); }
.mtile{ border-radius: var(--pos-radius, 8px); }
.alert-modal{ border-radius: var(--pos-radius, 6px); }
.comm-modal-inner{ border-radius: var(--pos-radius, 5px); }
.inst-sel-btn{ border-radius: var(--pos-radius, 8px); }
.cp-keypad button{ border-radius: var(--pos-radius, 3px); }
.refund-confirm{ border-radius: var(--pos-radius, 5px); }

.amount-box .val{ font-size: var(--pos-amt-font, 52px); }
.hint{ font-size: var(--pos-hint-font, 16px); }
.shortcut .lb{ font-size: var(--pos-menu-font, 13px); }
.tile .lb{ font-size: var(--pos-menu-font2, 16px); }

.alert-modal{ width: var(--pos-dialog-w, 240px); }

/* 选中效果(active): 默认 filled(即原设计,主色实心背景) */
#screen[data-active="outline"] .shortcut.sel,
#screen[data-active="outline"] .tile.sel{ background:#2a2a2a!important; border:2px solid var(--theme)!important; box-shadow:none!important; }
#screen[data-active="outline"] .mtile.sel{ background:#1a1a1a!important; border:2px solid var(--theme)!important; box-shadow:none!important; }
#screen[data-active="outline"] .menu-row.sel,
#screen[data-active="outline"] .mrow.sel{ background:transparent!important; border:2px solid var(--theme)!important; color:#fff!important; }

#screen[data-active="glow"] .shortcut.sel,
#screen[data-active="glow"] .tile.sel,
#screen[data-active="glow"] .mtile.sel{ box-shadow:0 0 10px var(--theme),0 0 3px var(--theme)!important; }
#screen[data-active="glow"] .menu-row.sel,
#screen[data-active="glow"] .mrow.sel{ box-shadow:0 0 10px var(--theme) inset!important; }

#screen[data-active="underline"] .shortcut.sel,
#screen[data-active="underline"] .tile.sel{ background:#2a2a2a!important; border:1px solid #333!important; box-shadow:none!important; border-bottom:3px solid var(--theme)!important; }
#screen[data-active="underline"] .mtile.sel{ background:#1a1a1a!important; border:none!important; box-shadow:none!important; border-bottom:3px solid var(--theme)!important; }
#screen[data-active="underline"] .menu-row.sel,
#screen[data-active="underline"] .mrow.sel{ background:transparent!important; color:#fff!important; border-bottom:3px solid var(--theme)!important; }

/* 退出按钮(exitBtn=true 时由JS插入 .pos-exit-btn) */
.pos-exit-btn{ position:absolute; top:2px; right:4px; width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; font-size:11px; line-height:16px; text-align:center; cursor:pointer; z-index:40; }
.pos-exit-btn:active{ background:rgba(255,255,255,.3); }

/* 位置微调(pos=key:dx:dy) 通过 transform 平移已打标的元素,不改变 display,不影响原始布局 */

/* ============ POS调色盘 参数总览面板(颜色/尺寸与布局) ============ */
.pos-panel-group{
  width:100%; max-width:780px; box-sizing:border-box;
  background:#15181f; border:1px solid rgba(255,255,255,.08); border-radius:14px;
  padding:16px 18px; margin-top:2px;
}
.pos-panel-title{ color:#fff; font-size:14px; font-weight:600; margin-bottom:10px; }
.pos-size-row{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  border-radius:12px; padding:10px 16px; margin-bottom:12px; color:#9a9aa5; font-size:13px;
}
.pos-size-row input[type=range]{ flex:1; accent-color:var(--theme,#4285f4); }
.pos-size-row b{ color:#fff; font-size:16px; min-width:44px; text-align:right; }
.pos-panel-body{ display:flex; flex-wrap:wrap; gap:8px; }
.pos-token-chip{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:5px 11px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  border-radius:20px; color:#dcdce1; font-size:12px;
}
.pos-token-chip i{ width:14px; height:14px; border-radius:4px; border:1px solid rgba(255,255,255,.25); display:inline-block; flex-shrink:0; }
.pos-token-chip:not(.has-swatch)::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--theme,#4285f4); display:inline-block; flex-shrink:0; }
.pos-token-chip b{ color:#fff; font-weight:600; }
.pos-token-chip b::after{ content:':'; color:rgba(255,255,255,.4); font-weight:400; margin-right:2px; }

// 每商户独立的交易明细（按商户名作 key）
function buildQrMerchantLedger(merchant){
  // 用商户 name 的字符做种子，保证每次进入数据稳定但各商户不同
  const seed = merchant.name.split('').reduce((s,c)=>s+c.charCodeAt(0),0);
  const PAYS = ['支付宝','微信','云闪付','数字人民币','其他'];
  const KINDS = [
    {ch:'支付宝扫码', pay:'支付宝',     k:'consume', s:'交易成功'},
    {ch:'微信扫码',   pay:'微信',       k:'consume', s:'交易成功'},
    {ch:'云闪付',     pay:'云闪付',     k:'consume', s:'交易成功'},
    {ch:'数字人民币', pay:'数字人民币', k:'consume', s:'交易成功'},
    {ch:'支付宝退款', pay:'支付宝',     k:'refund',  s:'退款成功'},
    {ch:'微信退款',   pay:'微信',       k:'refund',  s:'退款成功'}
  ];
  const list = [];
  const N = 6 + (seed % 5);
  for(let i=0;i<N;i++){
    const t = KINDS[(seed + i*7) % KINDS.length];
    const amt = ((seed*13 + i*97) % 30000) / 100 + 0.5;
    const hh = String((seed + i*3) % 24).padStart(2,'0');
    const mm = String((seed*5 + i*11) % 60).padStart(2,'0');
    list.push({
      no:    String(1000 - i*7).padStart(6,'0'),
      ref:   String(200000 + (seed + i*131) % 800000),
      channel: t.ch,
      chCat:  t.pay,
      payMethod: t.pay,
      amount: +amt.toFixed(2),
      time:  `2022-07-${String(29 - (i%10)).padStart(2,'0')} ${hh}:${mm}:29`,
      status:t.s,
      kind:  t.k,
      note:  i===0 ? '房间D123456' : (i%2 ? '' : '订单 #'+(seed+i))
    });
  }
  return list;
}

// =================== UTILITIES ===================
const $ = s => document.querySelector(s);
const body = $('#body');

function fmtAmt(digits){
  if(!digits) return '0';
  if(digits === '.') return '0.';
  if(digits.endsWith('.')) return digits;
  return digits;
}
function curAmtCents(){ return Math.round(parseFloat(S.amount||'0') * 100); }
function curAmtYuan(){ return fmtAmt(S.amount); }
function curAmtYuanFull(){ const v=curAmtYuan(); return v.includes('.')?v:v+'.00'; }
function renderHomeAmt(){
  const v=curAmtYuan();
  let intStr,decStr;
  if(v.includes('.')){const p=v.split('.');intStr=p[0];decStr='.'+(p[1]+'00').slice(0,2);}
  else{intStr=v;decStr='.00';}
  return '<span class="amt-sym">¥</span>'+intStr+'<span class="amt-dec">'+decStr+'</span>';
}

function syncHomeShortcutSel(){
  if(curAmtCents() <= 0) S.selectedShortcut = -1;
}

function canAddDigit(amountStr){
  if(!amountStr.includes('.')) return true;
  const parts = amountStr.split('.');
  return !parts[1] || parts[1].length < 2;
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, ms=1400){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), ms);
}
function voiceAnnounce(text){
  const old = $('#voice-announce');
  if(old){ clearTimeout(old._t); old.remove(); }
  const el = document.createElement('div');
  el.id = 'voice-announce';
  el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" flex-shrink="0"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span>${escHtml(text)}</span>`;
  el.style.flexShrink = '0';
  body.appendChild(el);
  el._t = setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 350); }, 2500);
}

// =================== ROUTER ===================
function go(screen, opts={}){
  if(!opts.noHistory){
    S.history.push({screen:S.screen});
  }
  S.screen = screen;
  Object.assign(S, opts.state || {});
  render();
}
function back(){
  // close overlays first
  if(S.drawerOpen){ S.drawerOpen=false; render(); return; }
  if(S.filterOpen){ closeFilterPanelCancel(); return; }
  // if in deep menu, pop menu stack first
  if(S.screen==='menu' && S.menuStack.length){
    S.menuStack.pop();
    S.selectedSubIdx = -1;
    render(); return;
  }
  if(S.history.length){
    const h = S.history.pop();
    S.screen = h.screen;
    // 回到页面 1 时自动清空金额
    if(S.screen === 'home'){
      S.amount = '';
      S.selectedShortcut = -1;
    }
    render();
  } else {
    goHome();
  }
}
function goHome(){
  S.history=[]; S.menuStack=[]; S.screen='home'; S.page=1;
  S.amount=''; S.selectedShortcut=-1; S.drawerOpen=false; S.filterOpen=false;
  S.pin=''; S.signaturePaths=[];
  S.selectedMenuIdx=-1; S.selectedSubIdx=-1;
  render();
}
// 取消/返回 → 按入口决定回首页还是回菜单
function exitTransaction(){
  if(_resultTimer){ clearTimeout(_resultTimer); _resultTimer=null; }
  if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer=null; }
  if(typeof _refundCountdownTimer !== 'undefined' && _refundCountdownTimer){ clearInterval(_refundCountdownTimer); _refundCountdownTimer=null; }
  S.drawerOpen=false; S.filterOpen=false; S.timePickerOpen=false;
  S.amount=''; S.selectedShortcut=-1;
  S.pin=''; S.signaturePaths=[];
  S.couponCode=''; S.couponQty=0; S.couponInfo=null;
  S.cancelPwd=''; S.cancelRefNo='';
  S.refundPwd=''; S.refundOrderNo=''; S.refundAmount=''; S.refundDate=''; S.refundRefNo='';
  S.refundResult=null;
  S.cardFlowType='consume';
  S.preAuthAmount=''; S.preAuthCardNo=''; S.preAuthExpiry=''; S.preAuthCvv='';
  S.pcDate=''; S.pcAuthNo=''; S.pcAmount=''; S.pcFocus='date';
  S.cardWaitNo=''; S.cardWaitExp=''; S.cardWaitFocus='no';
  S.scanCancelManual=''; S.gCancelManual='';
  if(S.txEntryPoint === 'menu' && S.txEntryMenuStack && S.txEntryMenuStack.length){
    S.menuStack = [...S.txEntryMenuStack];
    S.screen = 'menu'; S.history = [];
    render();
  } else if(S.txEntryPoint === 'drawer'){
    // 从便捷菜单进入：回首页并自动重新打开抽屉
    S.txEntryPoint = 'home';
    goHome();
    S.drawerOpen = true;
    render();
  } else {
    goHome();
  }
}

// =================== RENDER DISPATCH ===================
function render(){
  // 退出 result 屏幕时清掉 30s 超时计时器
  if(_resultTimer && S.screen !== 'result'){ clearTimeout(_resultTimer); _resultTimer = null; }
  // 离开收款界面时清掉 icon 循环计时器
  if(_iconCycleTimer && S.screen !== 'unified-pay'){ clearInterval(_iconCycleTimer); _iconCycleTimer = null; }
  // 离开扫码/刷卡/退货/担保相关界面时清掉 4s 自动触发计时器
  if(_scanTimer
     && S.screen !== 'unified-pay'
     && S.screen !== 'scan' && S.screen !== 'alipay-scan'
     && S.screen !== 'card-method' && S.screen !== 'refund-scan'
     && S.screen !== 'bankrefund-scan' && S.screen !== 'bankrefund-card'
     && S.screen !== 'guarantee-scan' && S.screen !== 'coupon-scan'

#ffefe8", "#fff0ea", "#fcd5c5", "#ffcdb8", "#ffcab4", "#ffddcf", "#fff4f0", "#fff9f6"], "ledger": "#4ECDC4", "secInk": "#EB5C20"}, {"id": "silver", "name": "优雅银", "theme": "#BFBFBF", "cur": "#00E5FF", "hint": "#B0B0B0", "sc0": "#1A1A1A", "sc1": "#1A1A2A", "acc": "#00E5FF", "pri": "#1A1A1A", "sec": "#B0B0B0", "t": ["#8c8c8c", "#dadada", "#b1b1b1", "#f3f3f3", "#f4f4f4", "#e0e0e0", "#dcdcdc", "#dadada", "#e7e7e7", "#f8f8f8", "#fbfbfb"], "ledger": "#FF6B6B", "secInk": "#1A1A1A"}];
const _ICON_ORIG = {};   // canonical (un-themed) sources
let _themeId = null;

function _detectInk(px){
  const c = new Map();
  for(let i=0;i<px.length;i+=4){
    const r=px[i],g=px[i+1],b=px[i+2],a=px[i+3];
    if(a>200 && !(r>225&&g>225&&b>225)){
      const k=(r<<16)|(g<<8)|b; c.set(k,(c.get(k)||0)+1);
    }
  }
  let best=null,n=-1;
  for(const [k,v] of c){ if(v>n){n=v;best=k;} }
  return best===null ? [35,124,253] : [(best>>16)&255,(best>>8)&255,best&255];
}
function _hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

// Re-ink a 2-tone icon: project every pixel onto the white->ink axis and
// remap that axis onto white->target, so anti-aliasing and white glyphs survive.
function recolorIcon(src, targetHex, glyphHex){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img,0,0);
      const d = ctx.getImageData(0,0,cv.width,cv.height), px = d.data;
      const ink = _detectInk(px), tgt = _hex2rgb(targetHex);
      const gly = glyphHex ? _hex2rgb(glyphHex) : [255,255,255];  // 字形色端点，默认白
      const dx = [ink[0]-255, ink[1]-255, ink[2]-255];
      const den = dx[0]*dx[0]+dx[1]*dx[1]+dx[2]*dx[2] || 1;
      for(let i=0;i<px.length;i+=4){
        if(px[i+3]===0) continue;
        let t = ((px[i]-255)*dx[0] + (px[i+1]-255)*dx[1] + (px[i+2]-255)*dx[2]) / den;
        t = t<0?0:(t>1?1:t);
        px[i]   = Math.round(gly[0] + t*(tgt[0]-gly[0]));
        px[i+1] = Math.round(gly[1] + t*(tgt[1]-gly[1]));
        px[i+2] = Math.round(gly[2] + t*(tgt[2]-gly[2]));
      }
      ctx.putImageData(d,0,0);
      res(cv.toDataURL('image/png'));
    };
    img.onerror = ()=>res(src);
    img.src = src;
  });
}

function _cacheOriginals(){
  if(_ICON_ORIG.done) return;
  _ICON_ORIG.sc0 = SHORTCUTS[0].icon;
  _ICON_ORIG.sc1 = SHORTCUTS[1].icon;
  _ICON_ORIG.resOk = IC_RES_OK;
  _ICON_ORIG.resFail = IC_RES_FAIL;
  _ICON_ORIG.iotOn = IC_IOT_ON;
  _ICON_ORIG.iotOff = IC_IOT_OFF;
  // 功能菜单图标：左侧四项(idx0,1,4,5)随主题色、账本(idx3)随提示语色、撤销退货(idx2)随强调色
  _ICON_ORIG.mTheme = [0, 1, 4, 5].map(i=>({i, src: MENU[i].ic}));
  _ICON_ORIG.mLedger = MENU[3].ic;
  _ICON_ORIG.mRefund = MENU[2].ic;
  const el = document.getElementById('sb-menu-ic');
  _ICON_ORIG.menu = el ? el.getAttribute('src') : '';
  _ICON_ORIG.done = true;
}

async function applyTheme(id, rerender){
  const T = (id && typeof id === 'object') ? id : (THEMES.find(x=>x.id===id) || THEMES[0]);
  _cacheOriginals();
  const r = document.documentElement.style;
  r.setProperty('--theme', T.theme);
  r.setProperty('--cur',   T.cur);
  r.setProperty('--hint',  T.hint);
  r.setProperty('--sc0bg', T.sc0);
  r.setProperty('--sc1bg', T.sc1);
  r.setProperty('--btn-pri', T.pri);
  r.setProperty('--btn-sec', T.sec);
  r.setProperty('--btn-sec-ink', T.secInk);
  r.setProperty('--amt', T.amt || '#fff');
  r.setProperty('--fw-glyph', (T.id === 'silver' || T.id === 'blackgold') ? '#1A1A1A' : '#ffffff');
  T.t.forEach((v,i)=>r.setProperty('--t'+(i+1), v));

  // 银色主题：收款(sc0) 与左侧四项(mTheme) 内部字形改黑色，避免白字形压浅银
  const _glyphSK = (T.id === 'silver' || T.id === 'blackgold') ? '#000000' : undefined;
  const [a,b,c,d,e,f,g,mr,ml,...mThemed] = await Promise.all([
    recolorIcon(_ICON_ORIG.sc0,     T.theme, _glyphSK),
    recolorIcon(_ICON_ORIG.sc1,     T.acc),
    recolorIcon(_ICON_ORIG.menu,    T.theme),
    recolorIcon(_ICON_ORIG.resOk,   T.theme),
    recolorIcon(_ICON_ORIG.resFail, T.theme),
    recolorIcon(_ICON_ORIG.iotOn,   T.theme),  // IoT 用主题色
    recolorIcon(_ICON_ORIG.iotOff,  T.theme),
    recolorIcon(_ICON_ORIG.mRefund, T.acc),    // 撤销/退货 -> 强调色
    recolorIcon(_ICON_ORIG.mLedger, T.ledger), // 账本 -> 该主题的账本专用色
    // 左侧四项(预授权/担保交易/管理/更多) -> 主题色
    ...(_ICON_ORIG.mTheme.map(o=>recolorIcon(o.src, T.theme, _glyphSK))),
  ]);
  SHORTCUTS[0].icon = a;
  SHORTCUTS[1].icon = b;
  const mi = document.getElementById('sb-menu-ic');
  if(mi) mi.src = c;
  IC_RES_OK = d; IC_RES_FAIL = e;
  IC_IOT_ON = f; IC_IOT_OFF = g;
  MENU[2].ic = mr;
  MENU[3].ic = ml;
  // 左侧四项(idx0,1,4,5)统一随主题色
  _ICON_ORIG.mTheme.forEach((o,idx)=>{ MENU[o.i].ic = mThemed[idx]; });
  if(typeof window.__updateIotIcon === 'function') window.__updateIotIcon();

  _themeId = T.id;
  try{ if (T.id && THEMES.some(x=>x.id===T.id)) localStorage.setItem('h9pro-theme', T.id); }catch(_){}
  if(rerender) render();
}

// 首页双击金额区：随机切到一个「不同的」主题
window.__randomTheme = function(){
  // 双击金额：按设置菜单顺序（THEMES 数组顺序）循环切换到下一个主题
  const idx = THEMES.findIndex(t => t.id === _themeId);
  const next = THEMES[(idx + 1) % THEMES.length];
  applyTheme(next.id, true);
  if(typeof toast === 'function') toast('主题：' + next.name);
};

// 键盘高亮索引：-1 表示未用键盘导航，默认落在当前生效主题上
let _themeCursor = -1;

function renderThemeSettings(){
  sbTitle('主题设置');
  const cur = THEMES.findIndex(t=>t.id===_themeId);
  const hl = _themeCursor >= 0 ? _themeCursor : cur;
  body.innerHTML = `
    <div class="menulist">
      <div class="menu-rows">
        ${THEMES.map((t,i)=>{
          const on = i===hl;
          // 高亮条用「所在项自己的主题色」，相当于选中前的预览；
          // 文字取该主题的 on-theme 色，金属银这类浅色主题才不会白字压浅底。
          const rowSty = on ? ` style="background:${t.theme};color:${t.pri}"` : '';
          const inkSty = on ? ` style="color:${t.pri}"` : '';
          const dotBd  = on ? t.pri : '#555';
          return `
          <div class="menu-row ${on?'sel':''}" data-th="${t.id}" data-i="${i}"${rowSty}>
            <span style="display:inline-flex;align-items:center;gap:8px">
              <span class="num"${inkSty}>${i+1}</span>
              <span style="width:14px;height:14px;border-radius:50%;flex-shrink:0;
                           background:${t.theme};border:1px solid ${dotBd};display:inline-block"></span>
              ${t.name}
            </span>
            <span class="chev"${inkSty}>${t.id===_themeId?'✓':'›'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  body.querySelectorAll('.menu-row').forEach(el=>{
    el.onclick = ()=>{ _themeCursor = -1; applyTheme(el.dataset.th, true); };
  });
  const selEl = body.querySelector('.menu-row.sel');
  if(selEl && selEl.scrollIntoView) selEl.scrollIntoView({block:'nearest'});
}

// 上/下移动高亮（只移动，不套用）
function themeCursorMove(dir){
  const cur = THEMES.findIndex(t=>t.id===_themeId);
  const from = _themeCursor >= 0 ? _themeCursor : cur;
  _themeCursor = (from + dir + THEMES.length) % THEMES.length;
  renderThemeSettings();
}
// 数字键 = 屏幕点击：直接套用对应主题
function themeCursorPick(num){
  if(num < 1 || num > THEMES.length) return;
  _themeCursor = -1;
  applyTheme(THEMES[num-1].id, true);
}
// 确认键套用高亮项
function themeCursorApply(){
  const cur = THEMES.findIndex(t=>t.id===_themeId);
  const i = _themeCursor >= 0 ? _themeCursor : cur;
  if(i < 0) return;
  _themeCursor = -1;
  applyTheme(THEMES[i].id, true);
}

// =================== HOME ===================
function renderHome(){
  syncHomeShortcutSel();
  const cards = SHORTCUTS.map((s,i)=>`
    <div class="shortcut ${S.selectedShortcut===i?'sel':''}" data-sc="${i}" data-pk="shortcut${i+1}">
      <img class="ic" src="${s.icon}" alt="${s.label}">
      <div class="lb">${s.label}</div>
    </div>`).join('');
  body.innerHTML = `
    <div class="home">
      <div class="topbar" style="height:32px;padding:0;align-items:center;position:relative">
        <div class="menubtn" id="menubtn" data-pk="hamburger"><span></span><span></span><span></span></div>
        <div class="hint" data-pk="amountLabel" style="position:absolute;left:0;right:0;text-align:center;pointer-events:none;color:var(--theme)">请输入金额</div>
      </div>
      <div class="amount-box">
        <span class="val" data-pk="amountValue">${renderHomeAmt()}</span>
      </div>
      <div class="shortcuts" style="margin-top:auto;grid-template-columns:repeat(${SHORTCUTS.length},1fr)${SHORTCUTS.length<=2?';width:100%;gap:16px;box-sizing:border-box':''}">${cards}</div>
    </div>`;
  $('#menubtn').onclick = ()=>{ S.drawerOpen=true; render(); };
  // 连击两下金额区随机切换主题（仅多主题版注入了 __randomTheme）
  const _amtBox = body.querySelector('.amount-box');
  if(_amtBox){
    _amtBox.style.cursor = 'pointer';
    _amtBox.ondblclick = ()=>{
      if(typeof window.__randomTheme === 'function') window.__randomTheme();
    };
  }
  body.querySelectorAll('.shortcut').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.sc;
      enterShortcut(i);
    };
  });
}

function enterShortcut(i){
  if(curAmtCents()<=0){
    toast('请先输入金额');
    return;
  }
  const s = SHORTCUTS[i];
  // 支付宝分期：金额必须 ≥ 100 元
  if(s.key === 'alipay' && curAmtCents() < 10000){
    toast('金额不得小于100元');
    return;
  }
  S.selectedShortcut = i;
  // 立即更新首页选中态，取消其他入口高亮
  body.querySelectorAll('.shortcut').forEach((el, idx) => {
    el.classList.toggle('sel', idx === i);
  });
  S.currentTxName = s.label;
  // 入口=首页（取消时回首页）
  S.txEntryPoint = 'home';
  S.txEntryMenuStack = [];
  switch(s.key){
    case 'unified': go('unified-pay'); break;
    case 'scan':   go('scan'); break;
    case 'alipay': S.scanPreview=false; S.installment=3; go('alipay-scan'); break;
    case 'qrcode': showCommModal('获取动态收款码', ()=>{ go('qrcode'); }); break;
    case 'card':   S.cardFlowType = 'consume'; go('card-method'); break;
  }
}
