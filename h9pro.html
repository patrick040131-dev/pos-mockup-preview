function sbTitle(txt, showFilter){
  const logo = document.getElementById('sb-logo');
  const title = document.getElementById('sb-title');
  const filt = document.getElementById('sb-filter');
  if(!logo||!title) return;
  const menuIc = document.getElementById('sb-menu-ic');
  if(txt){
    logo.style.display='none';
    title.textContent=txt;
    title.style.display='';
    if(menuIc) menuIc.style.display='';
  } else {
    title.style.display='none';
    if(menuIc) menuIc.style.display='none';
    logo.style.display='';
  }
  if(filt){ filt.style.display = showFilter ? 'inline-block' : 'none'; }
}

// Auto dark mode for tx screens
setTimeout(()=>{
  const _bd=document.getElementById('body');
  if(!_bd) return;
  const _sbf=document.getElementById('sb-filter');
  new MutationObserver(()=>{
    const hasTx=!!_bd.querySelector('.tx,.ledger,.qrm-wrap');
    _bd.classList.toggle('tx-dark', hasTx);
    if(hasTx){
      const t=_bd.querySelector(
        '.tx-head .title,.cp-head .title,.qrm-head .title,.settings-head-title,.led-top .title'
      );
      // Check if filter btn exists but is hidden (inside hidden led-tabs)
      const fo=_bd.querySelector('#filter-open');
      const hasHiddenFilter=fo&&fo.closest('[style*="display:none"]');
      sbTitle(t?t.textContent:null, !!hasHiddenFilter);
      if(_sbf&&hasHiddenFilter&&fo){
        _sbf.onclick=()=>fo.click();
      }
    } else if(!_bd.querySelector('.menulist')){
      sbTitle(null, false);
    }
  }).observe(_bd,{childList:true});
},0);
// 券核销 子菜单内新增「开通」项 -> 选择开通平台
(function(){
  function find(arr){ for(const n of (arr||[])){ if(n && n.n==='券核销') return n; if(n && n.c){ const r=find(n.c); if(r) return r; } } return null; }
  try{ const q = find(MENU); if(q){ q.c = q.c || []; if(!q.c.some(x=>x.n==='券核销开通')) q.c.push({n:'券核销开通', action:'activate-platform'}); } }catch(e){}
})();

let MENU_LAYOUT = 'split'; // 'split'(分栏,默认原版) | 'grid6'(经典六宫格,复用「更多」子菜单同款样式)

function renderMenu(){
  if(S.menuStack.length === 0){
    sbTitle(null);
    if (MENU_LAYOUT === 'grid6') {
      // 经典六宫格:跟分栏版保持同样的编号顺序(1-4原左列表项,5-6原右磁贴项),图标/样式直接复用「更多」子菜单的 .grid6+.tile
      const ORDER = [0,1,4,5,2,3];
      body.innerHTML = `
        <div class="menu-split">
          <div class="merchant-bar">盾科技实业有限公司</div>
          <div class="grid6" style="flex:1;height:auto">
            ${ORDER.map((idx,i)=>`
              <div class="tile ${S.selectedMenuIdx===idx?'sel':''}" data-i="${idx}" data-pk="menuItem${i+1}">
                <img class="ic" src="${MENU[idx].ic}" alt="${escHtml(MENU[idx].n)}">
                <div class="lb"><span class="num">${i+1}</span>${escHtml(MENU[idx].n)}</div>
              </div>`).join('')}
          </div>
        </div>`;
      body.querySelectorAll('.tile').forEach(el=>{
        el.onclick = ()=>{ S.selectedMenuIdx=-1; S.selectedSubIdx=-1; S.menuStack.push(+el.dataset.i); render(); };
      });
      return;
    }
    // 分屏菜单（左列表+右磁贴，原版默认布局）
    const LEFT = [{idx:0,num:1},{idx:1,num:2},{idx:4,num:3},{idx:5,num:4}];
    const RIGHT= [{idx:2,num:5},{idx:3,num:6}];
    body.innerHTML = `
      <div class="menu-split">
        <div class="merchant-bar">盾科技实业有限公司</div>
        <div class="menu-main">
          <div class="menu-left">
            ${LEFT.map(({idx,num})=>`
              <div class="mrow ${S.selectedMenuIdx===idx?'sel':''}" data-i="${idx}" data-pk="menuItem${num}">
                <img class="mic-sm" src="${MENU[idx].ic}" alt="">
                <span class="mnum">${num}</span>
                <span class="mname">${escHtml(MENU[idx].n)}</span>
                <span class="marr">›</span>
              </div>`).join('')}
          </div>
          <div class="menu-right">
            ${RIGHT.map(({idx,num})=>`
              <div class="mtile ${S.selectedMenuIdx===idx?'sel':''}" data-i="${idx}" data-pk="menuItem${num}">
                <img class="mic-lg" src="${MENU[idx].ic}" alt="">
                <div class="mtile-lb"><span class="mtile-num">${num} </span>${escHtml(MENU[idx].n)}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    body.querySelectorAll('.mrow,.mtile').forEach(el=>{
      el.onclick = ()=>{ S.selectedMenuIdx=-1; S.selectedSubIdx=-1; S.menuStack.push(+el.dataset.i); render(); };
    });
    return;
  }
  // 嵌套：定位当前节点
  let node = { c: MENU };
  for(const idx of S.menuStack){ node = node.c[idx]; }
  const title = node.n || '功能菜单';
  const enterChild = (i)=>{
    const child = node.c[i];
    if(!child) return;
    // 抖音 / 美团 / 淘宝闪购 券核销：进入时联机查询门店授权
    const channelMap = { '抖音券核销':'抖音', '美团券核销':'美团', '淘宝闪购券核销':'淘宝闪购' };
    if(channelMap[child.n]){
      const channel = channelMap[child.n];
      const isBound = (channel !== '淘宝闪购');
      const entryMenu = [...S.menuStack];
      showCommModal('正在查询门店授权', ()=>{
        if(!isBound){
          showAlert('门店未授权，请在拉卡拉APP授权后使用');
        } else {
          S.txEntryPoint = 'menu'; S.txEntryMenuStack = entryMenu;
          S.couponChannel = channel;
          S.couponCode = ''; S.couponQty = 0; S.couponInfo = null;
          go('coupon-scan');
        }
      });
      return;
    }
    // 核销记录：先联机查询，再进列表页
    if(child.n === '核销记录'){
      showCommModal('正在查询核销记录', ()=>go('coupon-records'));
      return;
    }
    // 扫码撤销：扫码 → 撤销信息确认 → 联机请求 → 结果
    if(child.n === '扫码撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.scanCancelCode = '';
      S.currentTxName = '扫码撤销';
      go('scancancel-scan');
      return;
    }
    // 退货流程入口（分期&码牌退货 / 扫码退货 / 银行卡退货）
    if(child.n === '分期&码牌退货' || child.n === '扫码退货'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.refundContext = (child.n === '分期&码牌退货') ? '分期退货' : '扫码退货';
      S.refundType    = (child.n === '分期&码牌退货') ? 'instalment' : 'scan';
      S.refundPwd = ''; S.refundOrderNo = ''; S.refundAmount = '';
      S.refundDate = ''; S.refundRefNo = '';
      S.refundFocus = 'order'; S.refundResult = null;
      go('refund-pwd');
      return;
    }
    if(child.n === '银行卡撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'cancel-card';
      S.cancelPwd = ''; S.cancelRefNo = '';
      go('cancel-pwd');
      return;
    }
    // 预授权撤销：扫码/手动输入小票 → 展示日期/授权号/金额 → 刷卡 → 密码 → 联机 → 结果
    if(child.n === '预授权撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'preauth-cancel';
      S.pcDate = ''; S.pcAuthNo = ''; S.pcAmount = '';
      S.pcFocus = 'date';
      S.amount = ''; S.pin = ''; S.signaturePaths = [];
      S.currentTxName = '预授权撤销';
      go('pcomplete-scan');
      return;
    }
    // 预授权完成撤销：流程同银行卡撤销
    if(child.n === '预授权完成撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'preauth-complete-cancel';
      S.cancelPwd = ''; S.cancelRefNo = '';
      S.amount = ''; S.pin = ''; S.signaturePaths = [];
      S.currentTxName = '预授权完成撤销';
      go('cancel-pwd');
      return;
    }
    if(child.n === '外卡无卡预授权'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.preAuthAmount = ''; S.preAuthCardNo = ''; S.preAuthExpiry = ''; S.preAuthCvv = '';
      S.preAuthFocus = 'cardNo';
      go('preauth-amount');
      return;
    }
    // 预授权（带卡）：金额 → 等待刷卡 → 输入密码 → 电子签名 → 结果
    if(child.n === '预授权' && !(child.c && child.c.length)){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'preauth';
      S.preAuthAmount = '';
      S.amount = '';
      S.pin = ''; S.signaturePaths = [];
      S.currentTxName = '预授权';
      go('preauth-amt-in');
      return;
    }
    // 预授权完成（带卡）：扫码 → 表单(日期/授权号/金额) → 等待刷卡 → 密码 → 签名 → 结果
    if(child.n === '预授权完成'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'preauth-complete';
      S.pcDate = ''; S.pcAuthNo = ''; S.pcAmount = '';
      S.pcFocus = 'date';
      S.amount = '';
      S.pin = ''; S.signaturePaths = [];
      S.cardWaitNo = ''; S.cardWaitExp = ''; S.cardWaitFocus = 'no';
      S.currentTxName = '预授权完成';
      go('pcomplete-scan');
      return;
    }
    // 预授权撤销：扫码/手动输入小票 → 展示日期/授权号/金额 → 刷卡 → 密码 → 联机 → 结果
    if(child.n === '预授权撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.cardFlowType = 'preauth-cancel';
      S.pcDate = ''; S.pcAuthNo = ''; S.pcAmount = '';
      S.pcFocus = 'date';
      S.amount = ''; S.pin = ''; S.signaturePaths = [];
      S.cardWaitNo = ''; S.cardWaitExp = ''; S.cardWaitFocus = 'no';
      S.currentTxName = '预授权撤销';
      go('pcomplete-scan');
      return;
    }
    // 担保交易（叶子节点；担保交易子菜单中的第一项）
    if(child.n === '担保交易' && !(child.c && child.c.length)){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.guaranteeAmount = ''; S.guaranteeNote = '';
      S.guaranteeFocus = 'amount';
      S.guaranteeType = 'transaction';
      go('guarantee-input');
      return;
    }
    if(child.n === '担保完成'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.gcompletionOrderNo = ''; S.gcompletionAmount = '';
      S.gcompletionFocus = 'order';
      S.guaranteeType = 'completion';
      go('gcompletion');
      return;
    }
    if(child.n === '担保撤销'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.guaranteeType = 'cancellation';
      go('gcancellation-scan');
      return;
    }
    if(child.n === '银行卡退货'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.refundContext = '银行卡退货';
      S.refundType    = 'card';
      S.refundPwd = ''; S.refundOrderNo = ''; S.refundAmount = '';
      S.refundDate = ''; S.refundRefNo = '';
      S.refundFocus = 'date'; S.refundResult = null;
      go('refund-pwd');
      return;
    }
    // 担保完成退货：主管密码 → 订单号+金额（订单号可扫码）→ 联机 → 结果
    if(child.n === '担保完成退货'){
      S.txEntryPoint = 'menu'; S.txEntryMenuStack = [...S.menuStack];
      S.refundContext = '担保完成退货';
      S.refundType    = 'guarantee-completion';
      S.refundPwd = ''; S.refundOrderNo = ''; S.refundAmount = '';
      S.refundFocus = 'order'; S.refundResult = null;
      go('refund-pwd');
      return;
    }
    // 经营分析：先联机查询，再进分析页
    if(child.n === '经营分析'){
      showCommModal('正在查询经营分析数据', ()=>go('coupon-analysis'));
      return;
    }
    if(child.action === 'activate-platform'){ go('platform-select'); return; }
    if(child.action === 'theme'){ go('theme-settings'); return; }
    if(child.action === 'ledger'){ S.ledgerTab = child.tab || 'detail'; S.ledgerTitle = child.tab ? child.n : null; go('ledger'); }
    else if(child.action === 'cloud-detail'){
      showCommModal('正在查询交易明细', ()=>go('cloud-detail'));
    }
    else if(child.action === 'cloud-summary'){
      showCommModal('正在查询交易汇总', ()=>go('cloud-summary'));
    }
    else if(child.action === 'qr-merchants'){
      showCommModal('正在查询码牌账本', ()=>go('qr-merchants'));
    }
    else if(child.n === 'TMS管理'){ go('firmware', {state:{currentTxName: child.n}}); }
    else if(child.c && child.c.length){ S.menuStack.push(i); render(); }
    else { go('stub', {state:{currentTxName: child.n}}); }
  };
  // gridStyle 节点：用 6 宫格渲染子菜单（如「更多」）
  if(node.gridStyle){
    sbTitle(title);
    body.innerHTML = `
      <div class="menulist">
        <div class="menu-head">
          <span class="back" id="m-back">‹</span>
          <span class="title">${escHtml(title)}</span>
        </div>
        <div class="grid6" style="flex:1;height:auto">
          ${node.c.map((child,i)=>`
            <div class="tile ${S.selectedSubIdx===i?'sel':''}" data-i="${i}">
              ${child.ic ? `<img class="ic" src="${child.ic}" alt="${escHtml(child.n)}">` : ''}
              <div class="lb"><span class="num">${i+1}</span>${escHtml(child.n)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    $('#m-back').onclick = back;
    body.querySelectorAll('.tile').forEach(el=>{
      el.onclick = ()=>enterChild(+el.dataset.i);
    });
    window.__enterMenuChild = enterChild;
    return;
  }
  // 普通嵌套列表
  sbTitle(title);
  body.innerHTML = `
    <div class="menulist">
      <div class="menu-head">
        <span class="back" id="m-back">‹</span>
        <span class="title">${escHtml(title)}</span>
      </div>
      <div class="menu-rows">
        ${(()=>{ let s=''; for(let g=0; g<node.c.length; g+=2){ s+='<div class="menu-group">'; for(let i=g; i<Math.min(g+2,node.c.length); i++){ const child=node.c[i]; s+=`<div class="menu-row ${S.selectedSubIdx===i?'sel':''}" data-i="${i}"><span><span class="num">${i+1}</span>${escHtml(child.n)}</span><span class="chev">›</span></div>`; } s+='</div>'; } return s; })()}
      </div>
    </div>`;
  $('#m-back').onclick = back;
  body.querySelectorAll('.menu-row').forEach(el=>{
    el.onclick = ()=>enterChild(+el.dataset.i);
  });
  // 暴露给键盘数字键调用
  window.__enterMenuChild = enterChild;
}

let _fwTimer = null;
function renderFirmware(){
  if(_fwTimer){ clearInterval(_fwTimer); _fwTimer = null; }
  const UP = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="var(--theme)"/><path d="M12 16.4V8.7M8.7 12 12 8.7 15.3 12" fill="none" stroke="var(--fw-glyph,#fff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--theme)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>';
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head"><span class="back" id="s-back">‹</span><span class="title">TMS管理</span></div>
      <div class="fw">
        <div class="fw-ic" id="fw-ic">${UP}</div>
        <div class="fw-msg" id="fw-msg">固件升级中，请勿断电</div>
        <div class="fw-bar"><div class="fw-fill" id="fw-fill"></div></div>
        <div class="fw-pct" id="fw-pct">0%</div>
      </div>
    </div>`;
  $('#s-back').onclick = ()=>{ if(_fwTimer){ clearInterval(_fwTimer); _fwTimer = null; } back(); };
  let pct = 0;
  _fwTimer = setInterval(()=>{
    if(S.screen !== 'firmware'){ clearInterval(_fwTimer); _fwTimer = null; return; }
    pct = Math.min(100, pct + 4);
    const f = document.getElementById('fw-fill'); const p = document.getElementById('fw-pct');
    if(f) f.style.width = pct + '%';
    if(p) p.textContent = pct + '%';
    if(pct >= 100){
      clearInterval(_fwTimer); _fwTimer = null;
      const ic = document.getElementById('fw-ic'); const msg = document.getElementById('fw-msg');
      if(ic) ic.innerHTML = OK;
      if(msg) msg.textContent = '固件升级完成';
      if(f) f.classList.add('done');
    }
  }, 250);
}

// 选择开通平台（券核销 -> 开通）
function renderPlatformSelect(){
  const ic = id => { const el = document.querySelector('#drawer .item[data-coupon="'+id+'"] img'); return el ? el.src : ''; };
  const plats = [
    { n:'抖音',     ic: ic('douyin')  },
    { n:'美团餐饮', ic: ic('meituan') },
    { n:'美团到综', ic: ic('meituan') },   // icon 复用美团餐饮
    { n:'淘宝闪购', ic: ic('taobao')  },
  ];
  window.__platforms = plats;
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head"><span class="back" id="t-back">‹</span><span class="title">请选择开通平台</span></div>
      <div class="plat-list">
        ${plats.map((p,i)=>`
          <div class="plat-row" data-i="${i}">
            <img class="plat-ic" src="${p.ic}" alt="">
            <span class="plat-nm">${escHtml(p.n)}</span>
            <span class="plat-chev">›</span>
          </div>`).join('')}
      </div>
    </div>`;
  $('#t-back').onclick = back;
  body.querySelectorAll('.plat-row').forEach(el=>{
    el.onclick = ()=>{ const p = plats[+el.dataset.i]; if(typeof toast==='function') toast('开通「'+p.n+'」（示意）'); };
  });

function renderUnifiedPay(){
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head"><span class="back" id="t-back">‹</span><span class="title">收款</span></div>
      <div style="height:26px"></div>
      <div class="tx-amt" style="background:transparent"><span class="cur">¥</span>${curAmtYuanFull()}</div>
      <div class="tx-hint" style="font-size:16px;color:#333;padding:8px 0;text-align:center">请出示付款码或使用银行卡</div>
      <div style="display:flex;justify-content:center;gap:22px;padding:26px 0 6px">
        <img id="pay-ic-a" src="${LG_SCAN}" style="width:62px;height:62px">
        <img id="pay-ic-b" src="${LG_TAP}"  style="width:62px;height:62px">
      </div>
      <div style="flex:1"></div>
    </div>`;
  $('#t-back').onclick = exitTransaction;
  voiceAnnounce('请出示付款码或使用银行卡');
  // icon 循环：扫码+挥卡 <-> 插卡+刷卡，每 2 秒切换
  if(_iconCycleTimer){ clearInterval(_iconCycleTimer); _iconCycleTimer = null; }
  {
    const _pairs = [[LG_SCAN, LG_TAP], [LG_INSERT, LG_CARD]];
    let _pi = 0;
    _iconCycleTimer = setInterval(()=>{
      const a = document.getElementById('pay-ic-a');
      const b = document.getElementById('pay-ic-b');
      if(!a || !b || S.screen !== 'unified-pay'){ clearInterval(_iconCycleTimer); _iconCycleTimer = null; return; }
      _pi = (_pi + 1) % _pairs.length;
      a.src = _pairs[_pi][0];
      b.src = _pairs[_pi][1];
    }, 2000);
  }
  // 5 秒后随机模拟检测到付款码 or 银行卡
  if(_scanTimer) clearTimeout(_scanTimer);
  _scanTimer = setTimeout(()=>{
    _scanTimer = null;
    if(S.screen !== 'unified-pay') return;
    const _amtYuan = parseFloat(S.amount||'0');
    const _isScanAmt = [11,22,33,44,55].includes(_amtYuan);
    if(_isScanAmt){
      // 检测到付款码 → 扫码流程
      runComm('正在请求支付', ()=>{
        showResult(true, {channel:'微信扫码', no:genTxNo()});
      });
    } else {
      // 检测到银行卡 → 直接进密码输入（跳过等待刷卡界面）
      S.cardFlowType = 'consume';
      S.cardWaitNo = '6214853388881008729'.slice(0,16);
      S.cardWaitExp = '2512';
      S.pin = '';
      runComm('正在读卡', ()=>{ go('card-pin'); });
    }
  }, 5000);
}

// 分期选择界面（扫码预览关闭时）
function renderAlipayInstallSelect(){
  if(!S.installment) S.installment = 3;
  const amt = curAmtCents();
  // 手续费率：3期0.7%/期，6期0.75%/期，12期0.72%/期
  const feeRates = {3:0.007, 6:0.0075, 12:0.0072};
  const opts = [
    { v:3,  n:'3', each:(amt/3/100).toFixed(2),  fee:((amt/100)*feeRates[3]).toFixed(2) },
    { v:6,  n:'6', each:(amt/6/100).toFixed(2),  fee:((amt/100)*feeRates[6]).toFixed(2) },
    { v:12, n:'12',each:(amt/12/100).toFixed(2), fee:((amt/100)*feeRates[12]).toFixed(2) },
  ];
  const rows = opts.map((o,i)=>`
    <div class="inst-radio ${S.installment===o.v?'sel':''}" data-v="${o.v}">
      <span class="inst-seq">${i+1}.</span>
      <span class="inst-p">${o.n}期</span>
      <span class="inst-amt">¥${o.each}/期</span>
      <div class="inst-radio-dot"><div class="inst-radio-inner"></div></div>
    </div>`).join('');
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head">
        <span class="back" id="t-back">‹</span>
        <span class="title">选择分期方式</span>
      </div>
      <div style="text-align:center;padding:8px 0 4px">
        <div class="tx-amt" style="background:transparent;font-size:28px;padding:0"><span class="cur" style="font-size:15px">¥</span>${curAmtYuanFull()}</div>
      </div>
      <div style="flex:1;padding:2px 14px 8px;display:flex;flex-direction:column;justify-content:center;gap:8px">${rows}</div>
    </div>`;
  $('#t-back').onclick = exitTransaction;
  body.querySelectorAll('.inst-radio').forEach(el=>{
    el.onclick = ()=>{
      S.installment = +el.dataset.v;
      renderAlipayPassive();
    };
  });
}

function renderCardMethod(){
  const title = S.cardFlowType === 'cancel-card'             ? '银行卡撤销'
              : S.cardFlowType === 'preauth-cancel'          ? '预授权撤销'
              : S.cardFlowType === 'preauth-complete-cancel' ? '预授权完成撤销'
              : S.cardFlowType === 'preauth'                 ? '预授权'
              : S.cardFlowType === 'preauth-complete'        ? '预授权完成'
              : '消费';
  // 预授权完成 / 预授权撤销：使用新版（Logo + 卡号 + 有效期）
  if(S.cardFlowType === 'preauth-complete' || S.cardFlowType === 'preauth-cancel'){
    renderCardWaitPreauth(title);
    return;
  }
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head"><span class="back" id="t-back">‹</span><span class="title">${title}</span></div>
      <div style="height:26px"></div>
      <div class="tx-amt" style="background:transparent"><span class="cur">¥</span>${curAmtYuanFull()}</div>
      <div class="tx-hint" style="font-size:16px;color:#333;padding:8px 0;text-align:center">请挥卡、插卡或刷卡</div>
      <div class="${S.cardFlowType!=='consume'?'card-methods-lg':''}" style="padding-top:16px">${CARD_METHODS_TPL}</div>
      <div style="flex:1"></div>
    </div>`;
  if(S.cardFlowType !== 'consume') voiceAnnounce('请使用银行卡');
  $('#t-back').onclick = exitTransaction;
  // 4 秒后自动检测到卡片，进入密码输入
  if(_scanTimer) clearTimeout(_scanTimer);
  _scanTimer = setTimeout(()=>{
    _scanTimer = null;
    if(S.screen === 'card-method'){ S.pin=''; go('card-pin'); }
  }, 4000);
}
// 预授权完成 / 预授权撤销 等待刷卡页：Logo + 卡号 + 有效期
function renderCardWaitPreauth(title){
  const f = S.cardWaitFocus;
  const cur = `<span class="cursor-blink">|</span>`;
  const formatNo = n => n.replace(/(.{4})/g,'$1 ').trim();
  const formatExp = v => v.length <= 2 ? v : v.slice(0,2) + '/' + v.slice(2,4);
  const noInp = S.cardWaitNo
    ? (f==='no' ? `${escHtml(formatNo(S.cardWaitNo))}${cur}` : escHtml(formatNo(S.cardWaitNo)))
    : `${f==='no' ? cur : ''}<span style="color:var(--t2)">请挥卡/插卡/刷卡/手输卡号</span>`;
  const expInp = S.cardWaitExp
    ? (f==='exp' ? `${escHtml(formatExp(S.cardWaitExp))}${cur}` : escHtml(formatExp(S.cardWaitExp)))
    : `${f==='exp' ? cur : ''}<span style="color:var(--t2)">有效期12/25=2512</span>`;
  body.innerHTML = `
    <div class="tx">
      <div class="cp-head"><span class="back" id="t-back">‹</span><span class="title">${title}</span></div>
      <div class="card-methods-lg" style="padding:14px 0 6px;display:flex;justify-content:center">
        ${CARD_METHODS_TPL}
      </div>
      <div class="refund-form" style="padding:6px 12px 6px">
        <div class="refund-row" data-cwfocus="no">
          <span class="lbl">卡号</span>
          <span class="inp" style="text-align:right">${noInp}</span>
        </div>
        <div class="refund-row" data-cwfocus="exp">
          <span class="lbl">卡片有效期</span>
          <span class="inp" style="text-align:right">${expInp}</span>
        </div>
        <div style="flex:1"></div>
      </div>
    </div>`;
  $('#t-back').onclick = exitTransaction;
  body.querySelectorAll('.refund-row[data-cwfocus]').forEach(r=>{
    r.onclick = ()=>{ S.cardWaitFocus = r.dataset.cwfocus; renderCardWaitPreauth(title); };
  });
  // 4 秒后自动「检测到卡」，自动填充并进入密码输入
  if(_scanTimer) clearTimeout(_scanTimer);
  _scanTimer = setTimeout(()=>{
    _scanTimer = null;
    if(S.screen !== 'card-method') return;
    if(!S.cardWaitNo) S.cardWaitNo = '6214853388881008729'.slice(0,16);
    if(!S.cardWaitExp) S.cardWaitExp = '2512';
    S.pin = '';
    go('card-pin');
  }, 4000);
}
function renderCardPin(){
  const title = S.cardFlowType === 'cancel-card'             ? '银行卡撤销'
              : S.cardFlowType === 'preauth-cancel'          ? '预授权撤销'
              : S.cardFlowType === 'preauth-complete-cancel' ? '预授权完成撤销'
              : S.cardFlowType === 'preauth'                 ? '预授权'
              : S.cardFlowType === 'preauth-complete'        ? '预授权完成'
              : '消费';
  body.innerHTML = `
    <div class="tx">
      <div class="tx-head"><span class="back" id="t-back">‹</span><span class="title">${title}</span></div>
      <div class="tx-main" style="gap:8px;justify-content:flex-start;padding-top:16px">
        <div style="font-size:12px;color:#fff;font-weight:600">金额：<span class="tx-num">${curAmtYuanFull()}</span>元</div>
        <div style="font-size:10px;color:var(--hint);margin-top:6px">请持卡人输入密码</div>
        <div class="pwd-dashes" id="pin-dots" style="width:75%;margin-top:8px">
          ${[0,1,2,3,4,5].map(i=>`<span>${i < S.pin.length ? '*' : ''}</span>`).join('')}
        </div>
        
      </div>
    </div>`;
  $('#t-back').onclick = exitTransaction;       // 取消即退出交易
}
function updatePinDots(){
  const dots = $('#pin-dots');
  if(!dots) return;
  dots.innerHTML = [0,1,2,3,4,5].map(i=>`<span>${i < S.pin.length ? '*' : ''}</span>`).join('');
}
function submitPin(){
  if(S.pin.length===0){ toast('请输入密码'); return; }
  // 预授权撤销：密码 → 联机请求 → 结果（无电子签名）
  if(S.cardFlowType === 'preauth-cancel'){
    runComm('正在请求预授权撤销', ()=>{
      showResult(true, {
        channel: '预授权撤销',
        no: genTxNo(),
        cardNo: '**** **** **** 8729'
      });
    });
    return;
  }
  let pinCommMsg = '正在请求支付';
  if(S.cardFlowType === 'cancel-card') pinCommMsg = '正在请求撤销';
  else if(S.cardFlowType === 'preauth') pinCommMsg = '正在请求授权';
  else if(S.cardFlowType === 'preauth-complete') pinCommMsg = '正在请求预授权完成';
  else if(S.cardFlowType === 'preauth-complete-cancel') pinCommMsg = '正在请求完成撤销';
  runComm(pinCommMsg, ()=>{
    // success → go to signature
    go('card-sign',{noHistory:false,state:{}});
  });
}
function drawSigWatermark(ctx, c){
  ctx.save();
  ctx.fillStyle = '#eef1f5';
  ctx.font = 'bold 26px "Arial Black", Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(c.width/2, c.height/2);
  ctx.rotate(-Math.PI/12);
  ctx.fillText('123456', 0, 0);
  ctx.restore();
}

               : isPCancel       ? '预授权撤销'
               : isPCComplCancel ? '预授权完成撤销'
               : isPreauth       ? '预授权'
               : isPComplete     ? '预授权完成'
               : '银行卡消费',
        no: genTxNo(),

function initSigCanvas(){
  const c = $('#sig');
  if(!c) return;
  const ctx = c.getContext('2d');
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing=false, lastX=0, lastY=0;
  function pos(e){
    const r = c.getBoundingClientRect();
    // canvas is inside screen which is transform:scale(2.5)
    const sx = r.width / c.width;
    const sy = r.height / c.height;
    return { x:(e.clientX - r.left)/sx, y:(e.clientY - r.top)/sy };
  }
  c.addEventListener('mousedown', e=>{
    drawing=true;
    const p = pos(e); lastX=p.x; lastY=p.y;
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y;
  });
  window.addEventListener('mouseup', ()=>{ drawing=false; });
}

// =================== COMMUNICATION ANIMATION ===================
// 联机请求：弹窗覆盖当前界面（不切换全屏联机页）
function runComm(msg, cb, delay=1400){
  showCommModal(msg, cb, delay);
}
function showCommModal(msg, cb, delay=1400){
  const m = $('#comm-modal');
  $('#comm-modal-msg').textContent = msg || '正在通讯';
  m.classList.add('on');
  setTimeout(()=>{
    m.classList.remove('on');
    if(typeof cb === 'function') cb();
  }, delay);
}
// 通用提示弹窗（带「知道了」按钮）
function showAlert(msg, onOk){
  const mask = $('#alert-mask');
  const dialog = $('#alert-modal');
  $('#alert-msg').textContent = msg;
  mask.classList.add('on');
  dialog.classList.add('on');
  const close = ()=>{
    mask.classList.remove('on');
    dialog.classList.remove('on');
    if(typeof onOk === 'function') onOk();
  };
  $('#alert-ok').onclick = close;
  mask.onclick = close;
}

function showResult(ok, data){
  S.resultOk = ok;
  S.resultData = Object.assign({
    amount: curAmtYuanFull(),
    time: nowStr(),
    no: data.no || genTxNo(),
  }, data);
  // overwrite history so result is terminal (back leads to home)
  S.history = [];
  go('result',{noHistory:true});
}
function renderResult(){
  const d = S.resultData || {};
  const ok = S.resultOk;
  const rows = [
    ['成交金额', '¥ ' + d.amount],
    ['交易时间', d.time],
    ['交易类型', d.channel || S.currentTxName],
    ['凭证号',   d.no]
  ];
  if(d.instal) rows.push(['分期数', d.instal+' 期']);
  if(!ok && d.reason) rows.push(['失败原因', d.reason]);
  body.innerHTML = `
    <div class="tx ${ok?'':'result-fail'}">
      <div class="result">
        <div class="result-status">
          <img class="ic" src="${ok?IC_RES_OK:IC_RES_FAIL}" alt="">
          <div>${ok?'交易成功':'交易失败'}</div>
        </div>
        ${rows.map(([k,v])=>`<div class="result-row"><span class="k">${k}</span><span class="v">${escHtml(String(v||''))}</span></div>`).join('')}
      </div>
      <div class="tx-footer" style="justify-content:center">
        <button id="r-back" style="${ok ? 'background:var(--theme);color:var(--btn-pri);font-weight:600;border-radius:4px;min-width:120px' : 'color:var(--btn-sec-ink);border-color:var(--theme);min-width:120px;font-weight:600'}">确认(5)</button>
      </div>
    </div>`;
  // 语音播报（在 body.innerHTML 赋值后执行，避免被清除）
  if(!ok){
    voiceAnnounce('交易失败');
  } else {
    const ch = (d.channel || '');
    if(ch === '微信扫码' || ch === '银行卡消费'){
      voiceAnnounce('拉卡拉到账' + d.amount + '元');
    } else {
      voiceAnnounce('交易成功');
    }
  }
  {
    const _startCountdown = () => {
      let _rcd = 5;
      const _rbtn = $('#r-back');
      const _exit = () => { clearInterval(_rtimer); _rkeyClean(); exitTransaction(); };
      if(_rbtn) _rbtn.onclick = _exit;
      const _rtimer = setInterval(() => {
        _rcd--;
        const b = $('#r-back');
        if(!b){ clearInterval(_rtimer); _rkeyClean(); return; }
        if(_rcd <= 0){ _exit(); }
        else{ b.textContent = '确认(' + _rcd + ')'; }
      }, 1000);
      const _rkeyHandler = (e) => {
        if(e.key === 'Escape' || e.key === 'Enter' || e.key === 'F4' || e.key === 'F1'){ _exit(); }
      };
      const _rkeyClean = () => document.removeEventListener('keydown', _rkeyHandler);
      document.addEventListener('keydown', _rkeyHandler);
    };
    if(ok){
      const _ov=document.createElement('div');
      _ov.style.cssText='position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.55);z-index:10;display:flex;align-items:center;justify-content:center';
      _ov.innerHTML='<div style="background:rgba(20,20,20,0.92);color:#fff;padding:14px 32px;border-radius:10px;font-size:14px;letter-spacing:2px">正在打印...</div>';
      body.querySelector('.tx').style.position='relative';
      body.querySelector('.tx').appendChild(_ov);
      setTimeout(()=>{ if(_ov.parentNode) _ov.remove(); _startCountdown(); }, 3000);
    } else {
      _startCountdown();
    }
  }
  // 30s 后自动回首页
  if(_resultTimer) clearTimeout(_resultTimer);
  _resultTimer = setTimeout(()=>{ _resultTimer = null; exitTransaction(); }, 30000);
}

// ============ 时间滚轮子弹窗（可被多处调用：云账本 / 核销记录 / 经营分析） ============
function getTimeFilterByScope(scope){
  switch(scope){
    case 'records':    return S.recordsFilter;
    case 'analysis':   return S.analysisFilter;
    case 'bankrefund': return S._bankrefundDateFilter || (S._bankrefundDateFilter = {timeStart:null,timeEnd:null});
    case 'qr':         return S.qrFilter;
    default:           return S.cloudFilter;
  }
}
function ensureFilterTimes(f){
  if(!f.timeStart || !f.timeEnd){
    const def = defaultCloudTimes();
    f.timeStart = def.start; f.timeEnd = def.end;
  }
}
function openTimePicker(target, scope){
  S.timePickerTarget = target;
  S.timePickerScope = scope || 'cloud';
  const f = getTimeFilterByScope(S.timePickerScope);
  ensureFilterTimes(f);
  const src = target === 'start' ? f.timeStart : f.timeEnd;
  S.timePickerDraft = Object.assign({}, src);
  S.timePickerOpen = true;
  renderTimePicker();
}
function renderTimePicker(){
  const mask = $('#time-mask');
  const picker = $('#time-picker');
  mask.classList.toggle('on', S.timePickerOpen);
  picker.classList.toggle('on', S.timePickerOpen);
  if(!S.timePickerOpen) return;
  const t = S.timePickerDraft;
  const target = S.timePickerTarget;
  let wheels = [
    { k:'y',  label:'年', min:2020, max:2030, pad:0 },
    { k:'mo', label:'月', min:1,    max:12,   pad:2 },
    { k:'d',  label:'日', min:1,    max:31,   pad:2 },
    { k:'h',  label:'时', min:0,    max:23,   pad:2 },
    { k:'mi', label:'分', min:0,    max:59,   pad:2 },
    { k:'s',  label:'秒', min:0,    max:59,   pad:2 }
  ];
  // 银行卡退货：只选月和日
  if(S.timePickerScope === 'bankrefund'){
    wheels = wheels.filter(w => w.k === 'mo' || w.k === 'd');
  }
  picker.innerHTML = `
    <div class="tp-title">选择${target === 'start' ? '开始' : '结束'}时间</div>
    <div class="tp-body">
      <div class="cf-wheel">
        ${wheels.map(w=>`
          <div class="cf-wheel-col">
            <button data-w="${w.k}" data-dir="up">▲</button>
            <div class="v">${w.pad?String(t[w.k]).padStart(w.pad,'0'):t[w.k]}</div>
            <button data-w="${w.k}" data-dir="down">▼</button>
          </div>`).join('')}
      </div>
      <div class="cf-wheel-labels">
        ${wheels.map(w=>`<span>${w.label}</span>`).join('')}
      </div>
    </div>
    <div class="tp-actions">
      <button id="tp-cancel">取消</button>
      <button class="primary" id="tp-ok">确认</button>
    </div>`;
  picker.querySelectorAll('.cf-wheel-col button').forEach(b=>{
    b.onclick = ()=>{
      const w = wheels.find(x=>x.k===b.dataset.w);
      let v = t[w.k] + (b.dataset.dir==='up' ? 1 : -1);
      if(v > w.max) v = w.min;
      if(v < w.min) v = w.max;
      t[w.k] = v;
      renderTimePicker();
    };
  });
  picker.querySelector('#tp-cancel').onclick = ()=>{
    S.timePickerOpen = false;
    renderTimePicker();
  };
  picker.querySelector('#tp-ok').onclick = ()=>{
    const scope = S.timePickerScope || 'cloud';
    const f = getTimeFilterByScope(scope);
    if(target === 'start') f.timeStart = Object.assign({}, t);
    else f.timeEnd = Object.assign({}, t);
    S.timePickerOpen = false;
    renderTimePicker();
    // 重绘对应的页面 / 弹层
    if(scope === 'cloud')         renderCloudFilterPanel($('#filter-panel'));
    else if(scope === 'records')  renderRecordsFilterPanel($('#filter-panel'));
    else if(scope === 'qr')       renderQrFilterPanel($('#filter-panel'));
    else if(scope === 'analysis') render();
    else if(scope === 'bankrefund'){
      // 银行卡退货 / 预授权完成：只保留 月-日
      const ts = S._bankrefundDateFilter && S._bankrefundDateFilter.timeStart;
      if(ts){
        const p = n=>String(n).padStart(2,'0');
        const dateStr = `${p(ts.mo)}-${p(ts.d)}`;
        if(S.screen === 'pcomplete-form'){
          S.pcDate = dateStr;
          renderPCompleteForm();
        } else {
          S.refundDate = dateStr;
          renderBankRefundForm();
        }
      } else if(S.screen === 'pcomplete-form'){
        renderPCompleteForm();
      } else {
        renderBankRefundForm();
      }
    }
  };
  $('#time-mask').onclick = ()=>{
    S.timePickerOpen = false;
    renderTimePicker();
  };
}

function renderQrLedgerSummary(){
  const list = qrLedgerFiltered();
  const PAYS = ['微信','支付宝','云闪付','数字人民币','其他'];
  const norm = p => PAYS.includes(p) ? p : '其他';
  const sec = (kind) => {
    const stats = Object.fromEntries(PAYS.map(p=>[p,{count:0,amount:0}]));
    list.filter(x=>x.kind===kind).forEach(x=>{
      const p = norm(x.payMethod);
      stats[p].count += 1;
      stats[p].amount += x.amount;
    });
    return stats;
  };
  const incomeS = sec('consume');
  const refundS = sec('refund');
  const sum = s => PAYS.reduce((acc,p)=>({c:acc.c+s[p].count,a:acc.a+s[p].amount}),{c:0,a:0});
  const inT = sum(incomeS);
  const rfT = sum(refundS);
  const txCount = inT.c + rfT.c;
  const netAmt  = inT.a - rfT.a;

  const renderRows = (stats) => PAYS.map(p=>`
    <div class="qrs-line">
      <span>${p}</span>
      <span class="cnt">${stats[p].count}笔</span>
      <span class="amt">¥${stats[p].amount.toFixed(2)}</span>
    </div>`).join('');

  body.innerHTML = `
    <div class="ledger">
      <div class="led-top">
        <span class="back" id="l-back">‹</span>

        <span class="print" id="l-print">打印</span>

        <div class="led-tabs">
          <div class="tab" data-t="detail">明细</div>
          <div class="tab on" data-t="summary">汇总</div>
          <div class="filter-btn" id="filter-open"><span class="pill">筛选</span></div>
        </div>
        <div class="led-main">
          <div class="qrs-scroll">
            <div class="qrs-group">
              <div class="ttl">收款</div>
              ${renderRows(incomeS)}
            </div>
            <div class="qrs-divider"></div>
            <div class="qrs-group">
              <div class="ttl">退款</div>
              ${renderRows(refundS)}
            </div>
            <div class="qrs-divider"></div>
            <div class="qrs-total">
              <span>收款合计</span>
              <span class="cnt">${inT.c}笔</span>
              <span class="amt">¥${inT.a.toFixed(2)}</span>
            </div>
            <div class="qrs-total">
              <span>退款合计</span>
              <span class="cnt">${rfT.c}笔</span>
              <span class="amt">¥${rfT.a.toFixed(2)}</span>
            </div>
            <div class="qrs-foot bold">
              <span>交易笔数</span><span class="v">${txCount}笔</span>
            </div>
            <div class="qrs-foot bold">
              <span>实收金额</span><span class="v">¥${netAmt.toFixed(2)}</span>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  $('#l-back').onclick = back;
  $('#l-print').onclick = ()=>toast('正在打印交易汇总');
  body.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ S.qrLedgerTab = el.dataset.t; render(); };
  });
  $('#filter-open').onclick = ()=>{
    S.qrFilterSnap = JSON.parse(JSON.stringify(S.qrFilter));
    S.filterContext = 'qr'; S.filterOpen = true; render();
  };
}

      </div>
    </div>`;
  voiceAnnounce('交易成功');
  {
    let _rcd = 5;
    const _rbtn = $('#r-back');
    const _exit = () => { clearInterval(_rtimer); _rkeyClean(); exitTransaction(); };
    if(_rbtn) _rbtn.onclick = _exit;
    const _rtimer = setInterval(() => {
      _rcd--;
      const b = $('#r-back');
      if(!b){ clearInterval(_rtimer); _rkeyClean(); return; }
      if(_rcd <= 0){ _exit(); }
      else{ b.textContent = '确认(' + _rcd + ')'; }
    }, 1000);
    // physical Cancel / Confirm key → immediate exit
    const _rkeyHandler = (e) => {
      if(e.key === 'Escape' || e.key === 'Enter' || e.key === 'F4' || e.key === 'F1'){ _exit(); }
    };
    const _rkeyClean = () => document.removeEventListener('keydown', _rkeyHandler);
    document.addEventListener('keydown', _rkeyHandler);
  }
  {
    const _ov=document.createElement('div');
    _ov.style.cssText='position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.55);z-index:10;display:flex;align-items:center;justify-content:center';

    body.querySelector('.tx').style.position='relative';
    body.querySelector('.tx').appendChild(_ov);
    setTimeout(()=>{ if(_ov.parentNode) _ov.remove(); }, 3000);
  }
  // 30s 后自动回首页
  if(_resultTimer) clearTimeout(_resultTimer);
  _resultTimer = setTimeout(()=>{ _resultTimer = null; exitTransaction(); }, 30000);
}

// Pseudo-QR SVG generator (looks like QR; not a valid code)
function qrSVG(seed){
  const sz = 25;
  // PRNG seeded from string
  let h = 2166136261;
  for(let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
  function rand(){ h = (h*9301 + 49297) % 233280; return h/233280; }
  let cells='';
  function inFinder(x,y,ox,oy){
    const lx=x-ox, ly=y-oy;
    if(lx<0||lx>6||ly<0||ly>6) return null;
    // 7x7 finder pattern: outer ring + center 3x3
    const outer = (lx===0||lx===6||ly===0||ly===6);
    const inner = (lx>=2 && lx<=4 && ly>=2 && ly<=4);
    return outer || inner;
  }
  for(let y=0;y<sz;y++){
    for(let x=0;x<sz;x++){
      const f1 = inFinder(x,y,0,0);
      const f2 = inFinder(x,y,sz-7,0);
      const f3 = inFinder(x,y,0,sz-7);
      const f = f1 ?? f2 ?? f3;
      let on;
      if(f !== null && f !== undefined) on = f;
      else on = rand() > 0.5;
      if(on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  }
  return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><g fill="#000">${cells}</g></svg>`;
}

// =================== INPUT: keypad ===================
function handleKey(k){
  // 设置页为模态：取消键退出，其余按键不穿透到底层界面
  if(isSettingsPageOpen()){
    if(k === 'cancel') closeTopSettingsPage();
    return;
  }
  // Visual press
  const btn = document.querySelector(`.key[data-k="${k}"]`);
  if(btn){
    btn.classList.add('press');
    setTimeout(()=>btn.classList.remove('press'), 100);
  }
  // 固件升级(TMS管理)：确认键/取消键均可退出
  if(S.screen === 'firmware'){
    if(k === 'confirm' || k === 'cancel'){ if(_fwTimer){ clearInterval(_fwTimer); _fwTimer = null; } back(); }
    return;
  }
  // 选择开通平台：取消键返回，数字键 1-4 选择平台
  if(S.screen === 'platform-select'){
    if(k === 'cancel'){ back(); }
    else if(/^[1-4]$/.test(k)){ const r = document.querySelectorAll('.plat-row')[+k-1]; if(r) r.click(); }
    return;
  }
  // 支付宝分期选择期数：数字键 1/2/3 直接选择对应期数
  if(S.screen === 'alipay-scan' && !S.scanPreview && /^[1-3]$/.test(k)){
    const opts=[3,6,12]; S.installment=opts[+k-1]; renderAlipayPassive(); return;
  }
  // 码牌账本筛选面板：参考号字段接收数字键和退格
  if(S.filterOpen && S.filterContext === 'qr'){
    if(/^\d$/.test(k)){
      if(S.qrFilter.refNo.length < 12){
        S.qrFilter.refNo += k;
        updateQrRefDisplay();
      }
      return;
    }
    if(k === 'clear'){
      S.qrFilter.refNo = (S.qrFilter.refNo||'').slice(0,-1);
      updateQrRefDisplay();
      return;
    }
  }
  // 控制中心打开时，取消键关闭控制中心
  if(k === 'cancel' && isCtrlPanelOpen()){
    closeCtrlPanelGlobal();
    return;
  }
  // Dispatch
  if(/^\d$/.test(k)){
    if(S.screen==='theme-settings'){ themeCursorPick(parseInt(k,10)); return; }
    if(S.screen==='home'){
      if(S.amount.length < 10){
        if(S.amount.includes('.')){
          const parts = S.amount.split('.');
          if(parts[1] && parts[1].length >= 2) return;
        }
        if(S.amount === '0' && k === '0') return;
        if(S.amount === '0' && k !== '0') S.amount = k;
        else S.amount += k;
        if(curAmtCents() > 0 && S.selectedShortcut === -1) S.selectedShortcut = 0;
        else syncHomeShortcutSel();
        render();
      }
    } else if(S.screen==='menu'){
      // 数字键 1-9 → 直接进入对应菜单项
      const num = parseInt(k, 10);
      if(num >= 1){
        let items = MENU;
        if(S.menuStack.length){
          let node = { c: MENU };
          for(const idx of S.menuStack){ node = node.c[idx]; }
          items = node.c || [];
        }
        if(num <= items.length){
          let i = num - 1;
          if(S.menuStack.length === 0){
            // 一级菜单显示顺序与 MENU 下标不一致，按显示序号映射
            const ORDER = [0, 1, 4, 5, 2, 3];
            i = ORDER[num - 1];
            S.menuStack.push(i);
            render();
          } else if(typeof window.__enterMenuChild === 'function'){
            window.__enterMenuChild(i);
          }
        }
      }
      return;
    } else if(S.screen==='card-pin'){
      // 输完 6 位后不自动提交，等用户按确认键
      if(S.pin.length<6){
        S.pin += k;
        updatePinDots();
      }
    } else if(S.screen==='coupon-manual'){
      if(S.couponCode.length < 18){
        S.couponCode += k;
        const el = document.getElementById('cp-code');
        if(el) el.textContent = S.couponCode;
      }
    } else if(S.screen==='refund-pwd'){
      if(S.refundPwd.length < 6){ S.refundPwd += k; updateRefundPwd(); }
    } else if(S.screen==='cancel-pwd'){
      if(S.cancelPwd.length < 6){
        S.cancelPwd += k;
        const d = $('#pwd-dashes');
        if(d) d.innerHTML = [0,1,2,3,4,5].map(i=>`<span>${i < S.cancelPwd.length ? '*' : ''}</span>`).join('');
      }
    } else if(S.screen==='cancel-ref'){
      if(S.cancelRefNo.length < 6){
        S.cancelRefNo += k;
        updateCancelRefDisplay();
      }
    } else if(S.screen==='card-method' && (S.cardFlowType==='preauth-cancel' || S.cardFlowType==='preauth-complete')){
      const target = S.cardWaitFocus === 'exp' ? 'cardWaitExp' : 'cardWaitNo';
      const max    = S.cardWaitFocus === 'exp' ? 4 : 19;

      if(S.preAuthAmount.length < 10 && canAddDigit(S.preAuthAmount)){ S.preAuthAmount += k; renderPreAuthAmount(); }
    } else if(S.screen==='preauth-amt-in'){
      if(S.preAuthAmount.length < 10 && canAddDigit(S.preAuthAmount)){ S.preAuthAmount += k; renderPreAuthAmtIn(); }
    } else if(S.screen==='pcomplete-form'){
      if(S.pcFocus === 'date') return;
      const fmap = { auth:'pcAuthNo', amount:'pcAmount' };
      const max  = { auth: 12,        amount: 10 };

        if(S.pcAmount.length < 10 && canAddDigit(S.pcAmount)){

      }

    } else if(S.screen==='scancancel-manual'){
      if(S.scanCancelManual.length < 20) { S.scanCancelManual += k; renderScanCancelManual(); }

          else S.gcompletionAmount += k;

      }
    } else if(S.screen==='refund-manual'){
      const target = S.refundFocus === 'amount' ? 'refundAmount' : 'refundOrderNo';
      if(S.refundFocus === 'amount'){
        if(S.refundAmount.length < 10 && canAddDigit(S.refundAmount)) S.refundAmount += k;
      } else {

      }

      const target = fmap[S.refundFocus] || 'refundRefNo';

        if(S.refundAmount.length < 10 && canAddDigit(S.refundAmount)) S.refundAmount += k;
      } else {
        if(S[target].length < 24) S[target] += k;
      }
      renderBankRefundForm();
    } else if(S.screen==='ledger' && S.ledgerTab==='detail'){
      const inp = document.getElementById('l-search');
      if(inp){
        if(S.ledgerSearch.length<6) S.ledgerSearch += k;
        inp.value = S.ledgerSearch;
        inp.dispatchEvent(new Event('input'));
      }
    }
    return;
  }
  if(k === '.'){
    if(S.screen==='home'){
      if(S.amount.length < 10 && !S.amount.includes('.')){
        if(S.amount === '' || S.amount === '0'){
          S.amount = '0.';
        } else {

        }

      'guarantee-input','guarantee-scan','guarantee-result',

    if(TX_SCREENS.indexOf(S.screen) >= 0){ exitTransaction(); return; }
    back();
    return;
  }
  if(k==='confirm'){
    // 账本明细 tab 有选中项时，进入该项详情
    if(S.screen === 'ledger' && S.ledgerTab === 'detail' && S.selectedLedgerIdx >= 0){
      const list = ledgerFiltered();
      const item = list[S.selectedLedgerIdx];
      if(item) go('ledger-detail', {state:{ledgerItem:item}});
      return;
    }
    // 云账本明细有选中项时，进入该项详情
    if(S.screen === 'cloud-detail' && S.selectedCloudIdx >= 0){
      const list = cloudLedgerFiltered();
      const item = list[S.selectedCloudIdx];
      if(item) go('ledger-detail', {state:{ledgerItem:item}});
      return;
    }
    // 码牌账本明细有选中项时，进入该项详情
    if(S.screen === 'qr-ledger' && S.qrLedgerTab === 'detail' && S.selectedQrIdx >= 0){
      const list = qrLedgerFiltered();
      const item = list[S.selectedQrIdx];
      if(item) go('qr-ledger-detail', {state:{qrLedgerItem:item}});
      return;
    }
    if(S.screen==='home'){
      if(curAmtCents()<=0){
        // go to page 2
        S.history.push({screen:'home'});
        S.screen='menu'; S.menuStack=[];
        render();
      } else {
        const i = S.selectedShortcut<0 ? 0 : S.selectedShortcut;
        enterShortcut(i);
      }
    } else if(S.screen==='card-pin'){
      submitPin();
    } else if(S.screen==='coupon-manual'){
      if(!S.couponCode){ toast('请输入券码'); return; }
      showCommModal('正在查询券信息', ()=>{
        S.couponInfo = lookupCoupon(S.couponCode);
        S.couponQty = 1;
        go('coupon-qty');
      });
    } else if(S.screen==='refund-pwd'){
      if(S.refundPwd.length < 6){ toast('请输入6位主管密码'); return; }
      if(S.refundType === 'card') go('bankrefund-form');
      else go('refund-manual');
    } else if(S.screen==='cancel-pwd'){
      if(S.cancelPwd.length < 6){ toast('请输入6位管理员密码'); return; }
      go('cancel-ref');
    } else if(S.screen==='cancel-ref'){
      if(!S.cancelRefNo){ toast('请输入交易凭证号'); return; }
      go('cancel-confirm');
    } else if(S.screen==='cancel-confirm'){
      $('#cancel-ok')?.click();
    } else if(S.screen==='scancancel-confirm'){
      $('#sc-ok')?.click();
    } else if(S.screen==='scancancel-scan'){
      if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
      S.scanCancelCode = '13' + Math.floor(1000000000000 + Math.random()*8999999999999);
      go('scancancel-confirm');
    } else if(S.screen==='preauth-amount'){
      submitPreAuthAmount();
    } else if(S.screen==='preauth-amt-in'){
      submitPreAuthAmtIn();
    } else if(S.screen==='pcomplete-form'){
      submitPCompleteForm();
    } else if(S.screen==='scancancel-manual'){
      submitScanCancelManual();
    } else if(S.screen==='gcancellation-manual'){
      submitGCancellationManual();
    } else if(S.screen==='preauth-cardinfo'){
      submitPreAuthCardInfo();
    } else if(S.screen==='guarantee-input'){
      submitGuaranteeInput();
    } else if(S.screen==='gcompletion'){
      submitGCompletion();
    } else if(S.screen==='refund-manual'){
      if(!S.refundOrderNo){ toast('请输入订单号'); S.refundFocus='order'; renderRefundManual(); return; }
      if(!S.refundAmount){ toast('请输入退款金额'); S.refundFocus='amount'; renderRefundManual(); return; }
      if(S.refundContext === '担保完成退货'){
        runComm('正在请求担保完成退货', ()=>{
          S.guaranteeType = 'gcompletionRefund';
          go('guarantee-result',{noHistory:true});
        });
      } else {
        runComm('正在请求退款', ()=>{
          const _ra = S.refundAmount || '0';
          showResult(true, {
            channel: S.refundContext === '扫码退货' ? '扫码退货' : '分期退货',
            amount:  _ra.includes('.') ? _ra : (_ra === '0' ? _ra : _ra + '.00'),
            no:      genTxNo()
          });
        });
      }
    } else if(S.screen==='bankrefund-form'){
      if(!S.refundDate){ toast('请选择原交易日期'); S.refundFocus='date'; renderBankRefundForm(); return; }
      if(!S.refundRefNo){ toast('请输入原交易参考号'); S.refundFocus='ref'; renderBankRefundForm(); return; }
      if(!S.refundAmount){ toast('请输入金额'); S.refundFocus='amount'; renderBankRefundForm(); return; }
      go('bankrefund-card');
    } else if(S.screen==='card-sign'){
      $('#t-ok')?.click();
    } else if(S.screen==='alipay-qr' || S.screen==='qrcode'){
      $('#t-query')?.click();
    } else if(S.screen==='scan'){
      if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
      runComm('正在请求支付', ()=>showResult(true, {channel:'微信扫码', no:genTxNo()}));
    } else if(S.screen==='alipay-scan'){
      if(!S.scanPreview){
        // 分期选择界面：确认键进入出示付款码
        renderAlipayPassive();
      } else {
        if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
        runComm('正在请求支付', ()=>showResult(true, {channel:'支付宝分期', no:genTxNo(), instal:S.installment}));
      }
    } else if(S.screen==='card-method'){
      if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }
      S.pin=''; go('card-pin');
    } else if(S.screen==='result'){
      $('#r-back')?.click();
    } else if(S.screen==='theme-settings'){
      themeCursorApply();
    } else if(S.screen==='menu'){
      // 一级 6 视图菜单：确认 → 进入选中项
      if(S.menuStack.length === 0 && S.selectedMenuIdx >= 0){
        const i = S.selectedMenuIdx;
        S.selectedMenuIdx = -1;
        S.menuStack.push(i);
        render();
      } else if(S.menuStack.length > 0 && S.selectedSubIdx >= 0
                && typeof window.__enterMenuChild === 'function'){
        // 次级菜单：确认 → 进入选中项
        const i = S.selectedSubIdx;
        S.selectedSubIdx = -1;
        window.__enterMenuChild(i);
      }
    }
    return;
  }
  if(k==='f1' || k==='f2'){
    // 支付宝分期：选择分期方式界面 上/下切换选项
    if(S.screen === 'alipay-scan' && !S.scanPreview){
      const opts = [3, 6, 12];
      let idx = opts.indexOf(S.installment);
      if(idx < 0) idx = 0;
      if(k === 'f1') idx = Math.max(0, idx - 1);
      else            idx = Math.min(opts.length - 1, idx + 1);
      S.installment = opts[idx];
      renderAlipayInstallSelect();
      return;
    }
    // 主题设置：F1 上一项 / F2 下一项（仅移动高亮，确认键才套用）
    if(S.screen === 'theme-settings'){
      themeCursorMove(k === 'f2' ? 1 : -1);
      return;
    }
    // 一级 6 视图菜单：F1 跳转到首页
    if(S.screen === 'menu' && S.menuStack.length === 0){
      if(k === 'f1'){
        goHome();
        return;
      }
      return;
    }
    // 次级菜单（嵌套列表 / grid 子菜单）：F1 上一项 / F2 下一项
    if(S.screen === 'menu' && S.menuStack.length > 0){
      let node = { c: MENU };
      for(const idx of S.menuStack){ node = node.c[idx]; }
      const total = (node.c || []).length;
      if(total === 0) return;
      if(S.selectedSubIdx < 0){
        S.selectedSubIdx = (k === 'f2') ? 0 : total - 1;
      } else {
        S.selectedSubIdx = (k === 'f2')
          ? (S.selectedSubIdx + 1) % total
          : (S.selectedSubIdx - 1 + total) % total;
      }
      render();
      return;
    }
    // 退货手动输入页：F1 输入小数点(金额字段时)或选订单号，F2 选退款金额
    if(S.screen === 'refund-manual'){
      if(k === 'f1' && S.refundFocus === 'amount'){
        if(!S.refundAmount.includes('.')){
          S.refundAmount += '.';
          renderRefundManual();
        }
      } else {
        S.refundFocus = (k === 'f1') ? 'order' : 'amount';
        renderRefundManual();
      }
      return;
    }
    // 预授权 / 外卡无卡预授权金额：F1(▲) 输入小数点
    if(k === 'f1' && (S.screen === 'preauth-amount' || S.screen === 'preauth-amt-in')){
      handleKey('.');
      return;
    }
    // 担保交易输入页：F1 输入小数点(金额字段时)或切换，F2 切换
    if(S.screen === 'guarantee-input'){
      if(k === 'f1' && S.guaranteeFocus === 'amount'){
        if(!S.guaranteeAmount.includes('.')){
          if(S.guaranteeAmount === '' || S.guaranteeAmount === '0'){
            S.guaranteeAmount = '0.';
          } else {
            S.guaranteeAmount += '.';
          }
          renderGuaranteeInput();
        }
      } else {
        S.guaranteeFocus = (k === 'f1') ? 'amount' : 'note';
        renderGuaranteeInput();
      }
      return;
    }
    // 担保完成：F1 输入小数点(金额字段时)或切换，F2 切换
    if(S.screen === 'gcompletion'){
      if(k === 'f1' && S.gcompletionFocus === 'amount'){
        if(!S.gcompletionAmount.includes('.')){
          S.gcompletionAmount += '.';
          renderGCompletion();
        }
      } else {
        S.gcompletionFocus = (k === 'f1') ? 'order' : 'amount';
        renderGCompletion();
      }
      return;
    }
    // 外卡无卡预授权 卡信息页：F1/F2 在 cardNo → expiry → cvv 之间循环
    if(S.screen === 'preauth-cardinfo'){
      const order = ['cardNo','expiry','cvv'];
      let i = order.indexOf(S.preAuthFocus);
      if(i < 0) i = 0;
      i = (k === 'f2') ? (i + 1) % order.length : (i - 1 + order.length) % order.length;
      S.preAuthFocus = order[i];
      renderPreAuthCardInfo();
      return;
    }
    // 预授权完成 / 预授权撤销 等待刷卡页：F1/F2 在 no ↔ exp 之间切换
    if(S.screen === 'card-method' && (S.cardFlowType==='preauth-cancel' || S.cardFlowType==='preauth-complete')){
      S.cardWaitFocus = (S.cardWaitFocus === 'no') ? 'exp' : 'no';
      renderCardMethod();
      return;
    }
    // 预授权完成表单：F1 输入小数点(金额字段时)或上移，F2 下移
    if(S.screen === 'pcomplete-form'){
      if(k === 'f1' && S.pcFocus === 'amount'){
        if(!S.pcAmount.includes('.')){
          S.pcAmount += '.';
          renderPCompleteForm();
        }
      } else {
        const order = ['date','auth','amount'];
        let i = order.indexOf(S.pcFocus);
        if(i < 0) i = 0;
        i = (k === 'f2') ? (i + 1) % order.length : (i - 1 + order.length) % order.length;
        S.pcFocus = order[i];
        renderPCompleteForm();
      }
      return;
    }
    // 银行卡退货表单：F1 输入小数点(金额字段时)或上移，F2 下移
    if(S.screen === 'bankrefund-form'){
      if(k === 'f1' && S.refundFocus === 'amount'){
        if(!S.refundAmount.includes('.')){
          S.refundAmount += '.';
          renderBankRefundForm();
        }
      } else {
        const order = ['date','ref','amount'];
        let i = order.indexOf(S.refundFocus);
        if(i < 0) i = 0;
        i = (k === 'f2') ? (i + 1) % order.length : (i - 1 + order.length) % order.length;
        S.refundFocus = order[i];
        renderBankRefundForm();
      }
      return;
    }
    // 核对券数量：F1 上 = 加；F2 下 = 减
    if(S.screen === 'coupon-qty'){
      const max = (S.couponInfo && S.couponInfo.max) || 99;
      if(k === 'f1'){
        if(S.couponQty >= max){ toast(`最多可用 ${max} 张`); return; }
        S.couponQty++;
      } else {
        if(S.couponQty > 0) S.couponQty--;
      }
      const el = document.getElementById('qty-num');
      if(el) el.textContent = S.couponQty;
      return;
    }
    // 账本：F2 选中下一条；F1 选中上一条；汇总 tab 按 F2 切到明细并选中第一条
    if(S.screen === 'ledger'){
      if(S.ledgerTab === 'summary'){
        if(k==='f2'){
          S.ledgerTab = 'detail';
          S.selectedLedgerIdx = 0;
          render();
        }
        return;
      }
      const list = ledgerFiltered();
      if(!list.length) return;
      if(k==='f2'){
        if(S.selectedLedgerIdx < 0) S.selectedLedgerIdx = 0;
        else if(S.selectedLedgerIdx < list.length - 1) S.selectedLedgerIdx++;
      } else {
        if(S.selectedLedgerIdx > 0) S.selectedLedgerIdx--;
      }
      render();
      return;
    }
    // 云账本明细：同样的 F1/F2 选中逻辑
    if(S.screen === 'cloud-detail'){
      const list = cloudLedgerFiltered();
      if(!list.length) return;
      if(k==='f2'){
        if(S.selectedCloudIdx < 0) S.selectedCloudIdx = 0;
        else if(S.selectedCloudIdx < list.length - 1) S.selectedCloudIdx++;
      } else {
        if(S.selectedCloudIdx > 0) S.selectedCloudIdx--;
      }
      render();
      return;
    }
    // 码牌账本明细：F1/F2 选中
    if(S.screen === 'qr-ledger' && S.qrLedgerTab === 'detail'){
      const list = qrLedgerFiltered();
      if(!list.length) return;
      if(k==='f2'){
        if(S.selectedQrIdx < 0) S.selectedQrIdx = 0;
        else if(S.selectedQrIdx < list.length - 1) S.selectedQrIdx++;
      } else {
        if(S.selectedQrIdx > 0) S.selectedQrIdx--;
      }
      render();
      return;
    }
    if(S.screen==='home'){
      if(k === 'f1'){
        if(!S.amount.includes('.')){
          if(S.amount === '' || S.amount === '0'){
            S.amount = '0.';
          } else {
            S.amount += '.';
          }
          if(curAmtCents() > 0 && S.selectedShortcut === -1) S.selectedShortcut = 0;
          else syncHomeShortcutSel();
          render();
        }
      } else if(k === 'f2'){
        if(curAmtCents() > 0){
          const dir = 1;
          if(S.selectedShortcut<0) S.selectedShortcut = 0;
          else S.selectedShortcut = (S.selectedShortcut + dir) % SHORTCUTS.length;
          render();
        } else {
          S.history.push({screen:'home'});
          S.screen='menu'; S.menuStack=[];
          render();
        }
      }
      return;
    }
    return;
  }
}

$('#keypad').addEventListener('click', e=>{
  const b = e.target.closest('button[data-k]');

// =================== INPUT: physical keyboard ===================
window.addEventListener('keydown', e=>{
  // ignore when typing in real input
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  // 设置页为模态：Esc(取消) 退出，其余按键不穿透
  if(isSettingsPageOpen()){
    if(e.key === 'Escape'){ e.preventDefault(); closeTopSettingsPage(); }
    return;
  }
  let k=null;
  if(/^[0-9]$/.test(e.key)) k = e.key;
  else if(e.key==='Enter') k='confirm';
  else if(e.key==='Escape') k='cancel';
    else if(e.key==='Backspace') k='clear';
    else if(e.key==='.') k='.';
    else if(e.key==='ArrowUp'){
    if(S.screen==='menu' && S.menuStack.length===0){
      goHome();
      e.preventDefault();
      return;
    }
    if(S.screen==='preauth-amount' || S.screen==='preauth-amt-in'){
      k='.';
    } else {
      k='f1';
    }
  }
  else if(e.key==='ArrowDown'){
    if(S.screen==='home' && !S.amount){
      S.history.push({screen:'home'});
      S.screen='menu'; S.menuStack=[];
      render();
      e.preventDefault();
      return;
    }
    k='f2';
  }
  else if(e.key==='ArrowLeft'){
    // swipe right (page 2 → page 1)
    if(S.screen==='menu' && S.menuStack.length===0){ goHome(); }
    e.preventDefault(); return;
  }
  else if(e.key==='ArrowRight'){
    // swipe left (page 1 → page 2)
    if(S.screen==='home' && !S.drawerOpen){
      S.history.push({screen:'home'});
      S.screen='menu'; S.menuStack=[];
      render();
    }
    e.preventDefault(); return;
  }
  if(k){ e.preventDefault(); handleKey(k); }
});

// =================== INPUT: swipe (mouse drag) ===================
(function(){
  const el = $('#screen');
  let down=false, sx=0, sy=0, moved=false;
  el.addEventListener('mousedown', e=>{
    // skip if interacting with a signature canvas or input
    if(e.target.closest('canvas.sig') || e.target.closest('input')) return;
    down=true; sx=e.clientX; sy=e.clientY; moved=false;
  });
  window.addEventListener('mousemove', e=>{
    if(!down) return;
    if(Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10) moved=true;
  });
  window.addEventListener('mouseup', e=>{
    if(!down) return; down=false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx)<60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    if(S.drawerOpen || S.filterOpen) return;
    if(dx < 0){
      // swipe left → home → menu
      if(S.screen==='home'){
        S.history.push({screen:'home'});
        S.screen='menu'; S.menuStack=[]; render();
      }
    } else {
      // swipe right → menu(top) → home
      if(S.screen==='menu' && S.menuStack.length===0) goHome();
    }
  });
})();

// =================== POS调色盘 智能搭配桥接层(URL参数) ===================
// 复用本文件已有的 THEMES / applyTheme / go 等基础设施,不改动任何页面结构、图标、字体、样式本身
(function(){
  function hexNorm(h){
    if(!h) return null;
    h = h.replace('#','');
    if(h.length===3) h = h.split('').map(c=>c+c).join('');
    return /^[0-9a-fA-F]{6}$/.test(h) ? '#'+h.toLowerCase() : null;
  }
  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function rgb2hex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function mix(hexA, hexB, t){
    const a=hex2rgb(hexA), b=hex2rgb(hexB);
    return rgb2hex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
  }
  function luminance(h){
    const [r,g,b]=hex2rgb(h).map(v=>v/255);
    const f=v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);
    return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
  }
  function autoInk(bgHex){ return luminance(bgHex) > 0.5 ? '#1a1a1a' : '#ffffff'; }
  function tintRamp(primary){
    // 逼近本文件内置7套主题里 t1~t11 的"由主色到白"的渐变节奏
    const ratios = [0.05,0.25,0.45,0.60,0.65,0.72,0.76,0.80,0.85,0.90,0.95];
    return ratios.map(r=>mix(primary,'#ffffff',r));
  }

  // 把 pos调色盘 skill 的通用配色参数名,映射为本文件 THEMES 数组的字段结构
  function buildThemeFromParams(p){
    const primary   = hexNorm(p.get('primary'))   || '#237CFD';
    const secondary = hexNorm(p.get('secondary')) || mix(primary,'#ffffff',0.75);
    const accent    = hexNorm(p.get('accent'))    || primary;
    const text      = hexNorm(p.get('text'))      || '#ffffff';
    const label     = hexNorm(p.get('label'))     || mix(primary,'#ffffff',0.55);
    const success   = hexNorm(p.get('success'))   || '#4ECDC4';
    const status    = hexNorm(p.get('status'))    || '#FFD700';
    const bgParam   = hexNorm(p.get('bg'));
    const darkBase  = bgParam || mix(primary,'#000000',0.85);
    return {
      id: null, name: '自定义',
      theme: primary,           // 主色:全局强调色(选中态/图标/高亮文字等,已自动带动图标重新着色)
      cur: status,              // 金额区¥符号颜色
      hint: label,              // 提示语/占位文字颜色
      sc0: mix(darkBase,'#000000',0.05),  // 快捷键区块背景0
      sc1: mix(darkBase,'#000000',0.12),  // 快捷键区块背景1
      acc: accent,              // 强调色(撤销/退货等图标)
      pri: autoInk(primary),    // 主色按钮上的文字/图标墨色(自动按对比度选黑或白)
      sec: secondary,           // 次要底色(辅助按钮/提示条背景)
      secInk: autoInk(secondary), // 次要底色上的文字墨色(自动对比度)
      t: tintRamp(primary),     // 主色到白的11级色阶,供各页面浅色底/边框使用
      ledger: success,          // 账本模块专属强调色
      amt: text,                // 金额数字颜色
    };
  }

  const params = new URLSearchParams(location.search);
  const COLOR_KEYS = ['primary','secondary','accent','text','label','status','success','bg'];
  const hasColorParams = COLOR_KEYS.some(k=>params.has(k));
  const themeParam = params.get('theme');

  // ---- 位置微调(pos=key:dx:dy) ----
  let posOffsets = {};
  const posParam = params.get('pos');
  if (posParam) {
    posParam.split(',').forEach(entry=>{
      const m = entry.match(/^([a-zA-Z0-9]+):(-?\d{1,3}):(-?\d{1,3})$/);
      if (m) posOffsets[m[1]] = { dx: parseInt(m[2],10), dy: parseInt(m[3],10) };
    });
  }
  function applyPositionOffsets(){
    document.querySelectorAll('[data-pk]').forEach(el=>{
      const off = posOffsets[el.getAttribute('data-pk')];
      el.style.transform = off ? `translate(${off.dx}px, ${off.dy}px)` : '';
    });
  }
  // 静态元素(状态栏左右分组、便携菜单4项)只需打一次标
  function tagStaticPk(){
    const l = document.querySelector('.statusbar .l');
    const r = document.querySelector('.statusbar .r');
    if (l) l.setAttribute('data-pk','statusBarLeft');
    if (r) r.setAttribute('data-pk','statusBarRight');
    const coupons = ['douyin','meituan','taobao','record'];
    coupons.forEach((c,i)=>{
      const el = document.querySelector('.drawer .item[data-coupon="'+c+'"]');
      if (el) el.setAttribute('data-pk','drawer'+(i+1));
    });
  }
  // 动态首页(logo/三横杆/提示语/金额/快捷键)每次 render() 都会重建 DOM,需要每次重新打标+应用
  if (typeof render === 'function' && Object.keys(posOffsets).length) {
    const _origRender = render;
    render = function(){ _origRender.apply(this, arguments); applyPositionOffsets(); };
  }

  // ---- 单独图标改色:scIconColors(快捷键) / menuIconColors(功能菜单,按展示顺序) ----
  function parseColorList(s){
    if (!s) return [];
    return s.split(',').map(h=>h.trim()).filter(h=>/^[0-9a-fA-F]{6}$/.test(h)).map(h=>'#'+h.toLowerCase());
  }
  async function applyIconColorOverrides(params){
    const scColors = parseColorList(params.get('scIconColors'));
    const mColors  = parseColorList(params.get('menuIconColors'));
    if (!scColors.length && !mColors.length) return false;
    _cacheOriginals();
    // 银色/商务金主题字形为深色,其余主题字形为白
    const _glyph = (_themeId === 'silver' || _themeId === 'blackgold') ? '#000000' : undefined;
    const jobs = [];
    // 快捷键图标:第1个=收款(sc0),第2个=支付宝分期(sc1)
    scColors.forEach((hex, i)=>{
      if (i < SHORTCUTS.length) jobs.push(recolorIcon(_ICON_ORIG['sc'+i], hex, _glyph).then(r=>{ SHORTCUTS[i].icon = r; }));
    });
    // 功能菜单图标:按展示顺序(menuItem1~6)对应 MENU 下标 [0,1,4,5,2,3],
    // 即 预授权/担保交易/管理/更多(左侧四项)+ 撤销退货/账本(右侧两项)
    const DISPLAY2MENU = [0,1,4,5,2,3];
    mColors.forEach((hex, i)=>{
      const idx = DISPLAY2MENU[i];
      if (idx === undefined) return;
      const orig = _ICON_ORIG.mTheme.find(o=>o.i===idx);
      const src = orig ? orig.src : (idx===2 ? _ICON_ORIG.mRefund : (idx===3 ? _ICON_ORIG.mLedger : null));
      if (!src) return;
      jobs.push(recolorIcon(src, hex, _glyph).then(r=>{ MENU[idx].ic = r; }));
    });
    if (jobs.length) await Promise.all(jobs);
    return true;
  }

  async function boot(){
    // 0) 菜单页布局:menuLayout=split(默认,分栏) | grid6(经典六宫格,复用"更多"同款样式与图标)
    const menuLayout = params.get('menuLayout');
    if (menuLayout && ['split','grid6'].includes(menuLayout) && typeof MENU_LAYOUT !== 'undefined') {
      MENU_LAYOUT = menuLayout;
    }

    // 1) 配色:优先用内置7套预设(theme=blue/blackgold/purple/red/green/orange/silver),
    //    否则只要出现任意一个通用配色参数就动态生成自定义主题并应用(含图标自动重新着色)
    let activeTheme = null;
    if (themeParam && typeof THEMES !== 'undefined' && THEMES.some(t=>t.id===themeParam)) {
      activeTheme = THEMES.find(t=>t.id===themeParam);
      await applyTheme(activeTheme, false);
    } else if (hasColorParams) {
      activeTheme = buildThemeFromParams(params);
      await applyTheme(activeTheme, false);
    } else {
      activeTheme = (typeof THEMES !== 'undefined' && THEMES.find(t=>t.id===_themeId)) || (typeof THEMES !== 'undefined' ? THEMES[0] : null);
    }
    // 单独图标改色(收款快捷键 + 功能菜单按展示顺序)在主题配色之后覆盖,再统一渲染
    const iconOverridden = await applyIconColorOverrides(params);
    if (iconOverridden || themeParam || hasColorParams) render();

    // 2) 页面跳转:page=amount/menu/order/success 映射到本文件的 home/menu/ledger/result 屏幕
    const PAGE_MAP = { amount:'home', home:'home', menu:'menu', ledger:'ledger', order:'ledger', result:'result', success:'result' };
    const page = params.get('page');
    if (page && PAGE_MAP[page] && typeof go === 'function') {
      setTimeout(()=>go(PAGE_MAP[page]), 60);
    }

    // 3) 整机缩放:size=small/medium/large 或 直接给百分比(如 size=120 表示120%);同时驱动面板里的实时滑块
    const SCALE_PRESET = { small:85, medium:100, large:115 };
    const size = params.get('size');
    let sizePercent = 100;
    if (size) {
      sizePercent = SCALE_PRESET[size] !== undefined ? SCALE_PRESET[size] : (/^\d{2,3}$/.test(size) ? parseInt(size,10) : 100);
    }
    initSizeSlider(sizePercent);

    // 4) 弧度/字号/选中效果/弹窗宽度:直接设 CSS 变量,样式桥接层(<style>末尾)会读取
    const root = document.documentElement.style;
    const radius = params.get('radius');
    if (radius) {
      const rMap = { sharp:2, soft:8, round:14 };
      const rv = rMap[radius] !== undefined ? rMap[radius] : (/^\d{1,2}$/.test(radius) ? parseInt(radius,10) : null);
      if (rv !== null) root.setProperty('--pos-radius', rv+'px');
    }
    const font = params.get('font');
    if (font && /^\d{2,3}$/.test(font)) root.setProperty('--pos-amt-font', font+'px');
    const labelSize = params.get('labelSize');
    if (labelSize && /^\d{1,2}$/.test(labelSize)) root.setProperty('--pos-hint-font', labelSize+'px');
    // 快捷键卡片高度 / 卡内图标大小(仅两首页的快捷键生效)
    const shortcutSize = params.get('shortcutSize');
    if (shortcutSize && /^\d{1,3}$/.test(shortcutSize)) root.setProperty('--pos-shortcut-h', shortcutSize+'px');
    const shortcutIcon = params.get('shortcutIcon');
    if (shortcutIcon && /^\d{1,2}$/.test(shortcutIcon)) root.setProperty('--pos-shortcut-ic', shortcutIcon+'px');
    // 机身(外壳)颜色,默认 #2F2B4E;只作用于 .device 外壳,不影响屏幕内配色
    const chassis = params.get('chassis');
    if (chassis && /^[0-9a-fA-F]{6}$/.test(chassis)) root.setProperty('--pos-chassis', '#'+chassis);
    const dialogW = params.get('dialogW');
    if (dialogW && /^\d{2,3}$/.test(dialogW)) root.setProperty('--pos-dialog-w', dialogW+'px');
    const active = params.get('active');
    if (active && ['filled','outline','glow','underline'].includes(active)) {
      const scr = document.getElementById('screen');
      if (scr) scr.setAttribute('data-active', active);
    }

    // 5) 退出按钮:exitBtn=true 时在状态栏右上角插入一个✕,点击直接回首页
    if (params.get('exitBtn') === 'true' || params.get('exitBtn') === '1') {
      const sb = document.querySelector('.statusbar');
      if (sb && !sb.querySelector('.pos-exit-btn')) {
        const btn = document.createElement('div');
        btn.className = 'pos-exit-btn';
        btn.textContent = '\u2715';
        btn.onclick = ()=>{ if (typeof goHome === 'function') goHome(); };
        sb.appendChild(btn);
      }
    }

    // 6) 位置微调:静态元素打标一次,首页等动态元素在其自身 render() 时已经打好标,这里统一应用一次
    tagStaticPk();
    applyPositionOffsets();

    // 7) 参数总览面板(颜色 / 尺寸与布局),始终展示当前生效值,方便核对
    renderPosPanels(activeTheme, { radius, font, labelSize, dialogW, active, size, page,
      shortcutSize, shortcutIcon, chassis,
      scIconColors: parseColorList(params.get('scIconColors')),
      menuIconColors: parseColorList(params.get('menuIconColors')),
      exitOn: params.get('exitBtn')==='true' || params.get('exitBtn')==='1',
      posCount: Object.keys(posOffsets).length,
      menuLayout: MENU_LAYOUT,
      themeName: (themeParam && THEMES.some(t=>t.id===themeParam)) ? THEMES.find(t=>t.id===themeParam).name : (hasColorParams ? '自定义' : ((THEMES.find(t=>t.id===_themeId)||{}).name || '默认'))
    });
  }

  function initSizeSlider(initialPercent){
    const slider = document.getElementById('posSizeSlider');
    const label = document.getElementById('posSizeVal');
    const deviceEl = document.querySelector('.device');
    if (!slider || !deviceEl) return;
    const apply = (v) => {
      label.textContent = v + '%';
      deviceEl.style.transform = 'scale(' + (v/100) + ')';
    };
    slider.value = initialPercent;
    apply(initialPercent);
    slider.oninput = () => apply(parseInt(slider.value, 10));
  }

  function renderPosPanels(T, sizeInfo){
    if (!T) return;
    const swatch = (hex, label, val) => `<span class="pos-token-chip has-swatch"><i style="background:${hex}"></i><b>${label}</b>${val||hex}</span>`;
    const plain = (label, val) => `<span class="pos-token-chip"><b>${label}</b>${val}</span>`;

    const colorHtml = [
      swatch(T.theme, '主色'),
      swatch(T.sec, '辅色'),
      swatch(T.acc, '强调色'),
      swatch(T.amt || '#ffffff', '文字/金额色'),
      swatch(T.hint, '提示语色'),
      swatch(T.cur, '状态色(¥符号)'),
      swatch(T.ledger, '成功色(账本)'),
      swatch(T.sc0, '按键底色'),
      plain('当前主题', sizeInfo.themeName),
    ].join('');

    const sizeHtml = [
      plain('弧度', sizeInfo.radius || 'sharp(默认3-8px)'),
      plain('金额字号', (sizeInfo.font || '52') + 'px'),
      plain('提示语字号', (sizeInfo.labelSize || '16') + 'px'),
      plain('快捷键卡高', (sizeInfo.shortcutSize || '56') + 'px'),
      plain('快捷键图标', (sizeInfo.shortcutIcon || '28') + 'px'),
      plain('机身颜色', sizeInfo.chassis ? '#' + sizeInfo.chassis : '#2F2B4E(默认)'),
      plain('弹窗宽', (sizeInfo.dialogW || '240') + 'px'),
      sizeInfo.scIconColors && sizeInfo.scIconColors.length ? plain('快捷键图标色', sizeInfo.scIconColors.map(c=>c.replace('#','')).join(',') + ' (scIconColors)') : '',
      sizeInfo.menuIconColors && sizeInfo.menuIconColors.length ? plain('菜单图标色(展示序)', sizeInfo.menuIconColors.map(c=>c.replace('#','')).join(',') + ' (menuIconColors)') : '',
      plain('选中效果', sizeInfo.active || 'filled(默认)'),
      plain('整机缩放', sizeInfo.size || '100%'),
      plain('菜单页布局', sizeInfo.menuLayout === 'grid6' ? '经典六宫格' : '分栏(默认)'),
      plain('当前页面', sizeInfo.page || 'home'),
      plain('退出按钮', sizeInfo.exitOn ? '开' : '关'),
      sizeInfo.posCount ? plain('位置微调', sizeInfo.posCount + '项') : '',
    ].join('');

    const colorPanel = document.getElementById('posColorPanel');
    const sizePanel = document.getElementById('posSizePanel');
    const colorChips = document.getElementById('posColorChips');
    const sizeChips = document.getElementById('posSizeChips');
    if (colorChips) colorChips.innerHTML = colorHtml;
    if (sizeChips) sizeChips.innerHTML = sizeHtml;
    if (colorPanel) colorPanel.style.display = '';
    if (sizePanel) sizePanel.style.display = '';
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(boot, 0);
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }
})();

</script>
</body>
</html>
